<script>
/* SRC-G05 · estado de carga antes de los módulos del juego: título visible, error recuperable, sin spinner infinito. */
(function () {
  var es = (document.documentElement.lang || 'es') !== 'en';
  var T = es ? { load: 'Cargando JET//Estación Silencio…', err: 'La carga se interrumpió. Podés volver a intentarlo.', net: 'No pudimos descargar todos los recursos.', retry: 'Volver a cargar', back: 'Volver a los juegos' }
             : { load: 'Loading JET//Silent Station…', err: 'Loading was interrupted. You can try again.', net: 'We couldn’t download all resources.', retry: 'Reload game', back: 'Back to games' };
  var listo = false, fallo = false;
  function el(id) { return document.getElementById(id); }
  function pintar() { var c = el('carga'); if (!c) return; el('cargaTxt').textContent = fallo ? (fallo === 'net' ? T.net : T.err) : T.load; el('cargaAcc').hidden = !fallo; el('cargaSpin').hidden = !!fallo; el('cargaRetry').textContent = T.retry; el('cargaBack').textContent = T.back; c.setAttribute('aria-busy', fallo ? 'false' : 'true'); }
  window.__estacionCarga = {
    listo: function () { listo = true; var c = el('carga'); if (c) { c.hidden = true; } clearTimeout(window.__estacionCarga.t); },
    error: function (tipo) { if (listo) return; fallo = tipo || 'err'; pintar(); },
    t: setTimeout(function () { if (!listo) { fallo = 'err'; pintar(); } }, 20000)
  };
  window.addEventListener('error', function (e) { if (listo) return; var src = e && e.target && e.target.tagName === 'SCRIPT'; window.__estacionCarga.error(src ? 'net' : 'err'); }, true);
  window.addEventListener('unhandledrejection', function () { if (!listo) window.__estacionCarga.error('err'); });
  document.addEventListener('DOMContentLoaded', function () { pintar(); el('cargaRetry').addEventListener('click', function () { location.reload(); }); });
})();
</script>
