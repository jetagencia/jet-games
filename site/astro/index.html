<script>
/* JET//Games — idioma único para todo el sitio (2026-10-22).
   Copiar tal cual al principio de cada juego (antes de pintar textos).
   Prioridad: ?lang=es|en en la URL  >  elección guardada (cookie de .jetgames.fun + localStorage)  >  idioma del navegador.
   La elección se comparte entre la portada y todos los juegos porque la cookie vale para todo jetgames.fun. */
(function () {
  'use strict';
  var KEY = 'jet_lang';
  var OK = { es: 1, en: 1 };

  function leerCookie() {
    var m = document.cookie.match(/(?:^|;\s*)jet_lang=(es|en)\b/);
    return m ? m[1] : null;
  }
  function guardar(lang) {
    var dominio = /(^|\.)jetgames\.fun$/.test(location.hostname) ? '; domain=.jetgames.fun' : '';
    var seguro = location.protocol === 'https:' ? '; Secure' : '';
    try { document.cookie = KEY + '=' + lang + '; path=/; max-age=31536000; SameSite=Lax' + dominio + seguro; } catch (e) {}
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }
  function delNavegador() {
    var l = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    return /^es\b/i.test(l) ? 'es' : 'en';
  }

  var desdeUrl = (location.search.match(/[?&]lang=(es|en)\b/) || [])[1] || null;
  var guardado = leerCookie();
  if (!guardado) { try { var ls = localStorage.getItem(KEY); if (OK[ls]) guardado = ls; } catch (e) {} }
  var actual = desdeUrl || guardado || delNavegador();
  if (desdeUrl || (guardado && !leerCookie())) guardar(actual);
  document.documentElement.lang = actual;

  window.JETIdioma = {
    get: function () { return actual; },
    /* Cambia el idioma, lo recuerda para todo el sitio y avisa con el evento 'jet-idioma'. */
    set: function (lang) {
      if (!OK[lang] || lang === actual) return;
      actual = lang; guardar(lang);
      document.documentElement.lang = lang;
      try { window.dispatchEvent(new CustomEvent('jet-idioma', { detail: lang })); } catch (e) {}
    },
  };
})();
</script>

<script>
/* JetSong · motor de música propia de JET//Games (Web Audio puro, sin samples ni archivos).
   Canción = secciones (acordes por compás, bajo, batería, melodía, arpegio) + orden con bucle. */
const JetSong=(()=>{
 let ac=null,out,mus,sfx,rev,nbuf,song=null,timer=0,run=false,nextT=0,pos=null,inten=0,leads={};
 const NT={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
 const md=n=>{const m=/^([A-G])(#|b)?(-?\d)$/.exec(n);return m?NT[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12:null;};
 const hz=m=>440*Math.pow(2,(m-69)/12);
 function imp(sec,dec){const L=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,L,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,dec);}return b;}
 function build(ctx){
  ac=ctx;out=ac.createDynamicsCompressor();out.threshold.value=-12;out.ratio.value=3.5;out.attack.value=.004;out.release.value=.2;out.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=0;sfx=ac.createGain();sfx.gain.value=.8;mus.connect(out);sfx.connect(out);
  rev=ac.createConvolver();rev.buffer=imp(2.8,3);const rg=ac.createGain();rg.gain.value=.32;rev.connect(rg);rg.connect(mus);
  nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }
 // ── voces ──
 function env(g,t,a,v,end){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,end);}
 function tail(node,amt){node.connect(mus);if(amt){const s=ac.createGain();s.gain.value=amt;node.connect(s);s.connect(rev);}}
 function osc(type,f,t,end,det){const o=ac.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.start(t);o.stop(end+.05);return o;}
 const V={
  pad(t,ms,dur,v,o={}){const end=t+dur+(o.rel||.8);const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=.6;f.frequency.setValueAtTime(o.cut||900,t);f.frequency.linearRampToValueAtTime((o.cut||900)*1.6,t+dur*.5);f.frequency.linearRampToValueAtTime(o.cut||900,t+dur);
   const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.att||.5));g.gain.setValueAtTime(v,t+dur);g.gain.exponentialRampToValueAtTime(.0001,end);f.connect(g);tail(g,o.rv??.5);
   const pv=1/ms.length;ms.forEach(m=>[-9,9].forEach(dt=>{const x=osc(o.w||'sawtooth',hz(m),t,end,dt);const a=ac.createGain();a.gain.value=pv*.5;x.connect(a);a.connect(f);}));},
  bass(t,m,dur,v,o={}){const end=t+dur+.06;const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||4;f.frequency.setValueAtTime(o.cut||1400,t);f.frequency.exponentialRampToValueAtTime(o.cut2||220,t+Math.min(dur,.25));
   const g=ac.createGain();env(g,t,.006,v,end);osc(o.w||'sawtooth',hz(m),t,end).connect(f);f.connect(g);const s=ac.createGain();env(s,t,.006,v*.7,end);osc('sine',hz(m),t,end).connect(s);s.connect(mus);tail(g,0);},
  sub(t,m,dur,v){const end=t+dur+.3;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.setValueAtTime(v,t+dur*.8);g.gain.exponentialRampToValueAtTime(.0001,end);osc('sine',hz(m),t,end).connect(g);const g2=ac.createGain();g2.gain.value=.18;osc('triangle',hz(m+12),t,end).connect(g2);g2.connect(g);tail(g,0);},
  pluck(t,m,dur,v,o={}){const end=t+Math.max(dur,.18)+.25;const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(o.cut||3800,t);f.frequency.exponentialRampToValueAtTime(500,t+.3);
   const g=ac.createGain();env(g,t,.004,v,end);osc(o.w||'square',hz(m),t,end).connect(f);f.connect(g);tail(g,o.rv??.3);},
  bell(t,m,dur,v,o={}){const end=t+Math.max(dur*1.5,.5)+.4;const c=osc('sine',hz(m),t,end);const mo=osc('sine',hz(m)*(o.ratio||3.5),t,end);const mg=ac.createGain();mg.gain.setValueAtTime(hz(m)*(o.idx||1.2),t);mg.gain.exponentialRampToValueAtTime(hz(m)*.05,t+.6);mo.connect(mg);mg.connect(c.frequency);
   const g=ac.createGain();env(g,t,.003,v,end);c.connect(g);tail(g,o.rv??.55);},
  keys(t,m,dur,v,o={}){V.bell(t,m,dur,v,{ratio:1,idx:o.idx||.9,rv:o.rv??.35});const g=ac.createGain();env(g,t,.004,v*.35,t+dur+.4);osc('triangle',hz(m),t,t+dur+.4).connect(g);tail(g,.2);},
  lead(t,m,dur,v,o={}){const end=t+dur+(o.rel||.12);const x=osc(o.w||'square',hz(m),t,end);const x2=osc('sawtooth',hz(m),t,end,o.det||7);
   const l=osc('sine',5.2,t,end);const lg=ac.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(hz(m)*.006,t+Math.min(.35,dur));l.connect(lg);lg.connect(x.frequency);lg.connect(x2.frequency);
   const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=1;f.frequency.setValueAtTime(o.cut||2600,t);const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.setValueAtTime(v*.8,t+dur);g.gain.exponentialRampToValueAtTime(.0001,end);
   const a=ac.createGain();a.gain.value=.5;x.connect(a);x2.connect(a);a.connect(f);f.connect(g);tail(g,o.rv??.35);},

    start() { if (!AUD.sfxOn()) return; [523, 659, 784].forEach((f, i) => JetSong.tone(f, 0.18, 'triangle', 0.07, null, i * 0.06)); },
    pause() { if (!AUD.sfxOn()) return; JetSong.tone(660, 0.08, 'triangle', 0.05, 440); },
  };
  const canvas = $('c'), ctx = canvas.getContext('2d'), stage = $('stage');
  const overlay = $('overlay'), playBtn = $('play'), pauseBtn = $('pause');
  const hudS = $('hud-s'), hudB = $('hud-b'), tipEl = $('tip');

  // Selector ES | EN también dentro del panel de sonido y ajustes (el mismo que en la pantalla de inicio)
  {
    const row = document.createElement('div'); row.className = 'ja-lang';
    row.innerHTML = '<span data-i="lang"></span>' + document.querySelector('#overlay .lang-seg').outerHTML;
    AUD.el.querySelector('.ja-p').appendChild(row);
  }
  document.querySelectorAll('.lang-seg button').forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); if (window.JETIdioma) JETIdioma.set(b.dataset.lang); b.blur();
  }));

  // Pinta todos los textos visibles en el idioma actual, según la pantalla en la que esté el juego
  function paintOverlay() {
    const kind = overlay.dataset.kind || 'start', k = $('ov-kicker');
    if (kind === 'pause') { k.textContent = TX.paused; playBtn.textContent = TX.resume; $('ov-hint').textContent = TX.pauseHint; }
    else if (kind === 'over') {
      k.textContent = TX.impact; playBtn.textContent = TX.retry; $('ov-hint').textContent = TX.again;
      $('ov-score').textContent = `${s.score} ${TX.pts}`;
      $('ov-best').innerHTML = s.lastRecord && best > 0 ? `<b>${TX.newBest}</b>` : `${TX.best}: <b>${best}</b>`;
    } else {
      k.textContent = TX.dodge; playBtn.textContent = TX.launch; $('ov-hint').textContent = TX.how;
      if (best > 0) $('ov-best').innerHTML = `${TX.best}: <b>${best}</b>`;
    }
  }
  function applyLang() {
    const lang = curLang(); TX = DICT[lang];
    document.documentElement.lang = lang;
    document.title = TX.title;
    const md = $('meta-desc'); if (md) md.setAttribute('content', TX.desc);
    document.querySelectorAll('[data-i]').forEach(el => { el.textContent = TX[el.dataset.i]; });
    document.querySelectorAll('[data-i-aria]').forEach(el => { el.setAttribute('aria-label', TX[el.dataset.iAria]); });
    canvas.setAttribute('aria-label', TX.canvas);
    pauseBtn.setAttribute('aria-label', TX.pause); pauseBtn.title = TX.pause + (TOUCH ? '' : ' (P)');
    document.querySelectorAll('.lang-seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
    AUD.setTx(TX.audio);
    paintOverlay();
    if (s.running) $('hint').textContent = TX.play;

  }
  // cambio en vivo: repinta sin recargar ni tocar la partida en curso
  window.addEventListener('jet-idioma', applyLang);

  // ── Mundo en unidades propias. El alto del cielo crece en vertical (teléfono de pie) para usar toda la
  //    pantalla; la física y el ancho visible no cambian, así el juego es igual de justo en todos lados. ──
  const ASIZE = 30;
  const STEP = 1000 / 60;            // física a 60 Hz fijos, igual en pantallas de 120 Hz
  let W = 460, H = 200, GROUND = 160, AX = 60, TALL = false;

  // Salto variable: un toque (hasta 4 cuadros) da siempre el mismo salto corto; mantener enciende el jetpack
  // del cuadro 5 al 18 y casi duplica la altura. Soltar apaga el impulso de ese salto.
  const JUMP_V = 7.6, G = 0.62, G_HOLD = 0.12, HOLD_FROM = 4, HOLD_MAX = 18, DROP_V = -9;
  const SPEED0 = 3.6, SPEED_ADD = 4.4, SPEED_K = 9000;

  const BEST_KEY = 'jet-astro:best';
  let best = 0;
  try { best = parseInt(localStorage.getItem(BEST_KEY) || '0', 10) || 0; } catch (e) {}

  // alt = altura de los pies sobre el suelo (0 = en el suelo); vy > 0 sube
  const s = {
    alt: 0, vy: 0, hold: false, holdT: 0, canBoost: false, obs: [], particles: [],
    starsBack: [], starsFront: [], craters: [], ridge: [], ridgeX: 0,
    score: 0, dist: 0, speed: SPEED0, next: 0, running: false, paused: false, over: false,
    frame: 0, buffer: 0, overAt: 0, runPh: 0, shake: 0, mile: 0, mileT: 0, tips: {},
  };

  function layout() {
    const app = $('app'), cs = getComputedStyle(app);
    const title = app.querySelector('.title');
    const titleH = title.offsetParent ? title.offsetHeight : 0;
    const hintH = $('hint').offsetHeight || 16;
    const gap = parseFloat(cs.rowGap) || 0;
    const availW = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const availH = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (titleH ? titleH + gap : 0) - hintH - gap - 2;
    TALL = availH > availW * 1.05;
    let scale;
    if (TALL) {
      W = 360; scale = availW / W;
      H = Math.round(Math.max(200, Math.min(660, availH / scale)));
      GROUND = H - Math.round(40 + (H - 200) * 0.40);
      AX = 44;
    } else {
      H = 200; GROUND = 160; AX = 60;
      W = Math.round(Math.min(760, Math.max(360, H * availW / Math.max(availH, 1))));
      scale = Math.max(0.5, Math.min(availW / W, availH / H));
    }
    const cssW = Math.floor(W * scale), cssH = Math.floor(H * scale);
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    stage.classList.toggle('compact', cssH < 250);
    stage.classList.toggle('tall', TALL);
    stage.style.setProperty('--sky', (GROUND / H * 100).toFixed(1) + '%');
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    seedScenery(true);
    draw();
  }

  function seedScenery(keep) {
    const r = Math.random;
    if (!keep || !s.starsBack.length || s._sw !== W || s._sg !== GROUND) {
      s.starsBack = Array.from({ length: Math.round(W * GROUND / 2600) }, () => ({ x: r() * W, y: r() * (GROUND - 10), r: r() * 0.8 + 0.3, phase: r() * 6.3 }));
      s.starsFront = Array.from({ length: Math.round(W * GROUND / 7600) }, () => ({ x: r() * W, y: r() * (GROUND - 20), r: r() * 1.2 + 0.7, vx: 0.4 + r() * 0.4 }));
      const band = H - GROUND;
      s.craters = Array.from({ length: Math.round(W * band / 1000) }, () => {
        const d = r(); return { x: r() * W * 1.2, d, y: GROUND + 6 + d * (band - 10), r: 1 + r() * 2.5 + d * 3 };
      });
      // cordillera lejana (parallax), alturas suaves que se repiten
      s.ridge = Array.from({ length: 24 }, (_, i) => 6 + Math.abs(Math.sin(i * 1.7) * 14) + r() * 10);
      s._sw = W; s._sg = GROUND;
    }
  }

  function dust(n, vy, max, color) {
    for (let i = 0; i < n; i++) s.particles.push({
      x: AX + ASIZE / 2 + (Math.random() - 0.5) * 10, alt: 1,
      vx: (Math.random() - 0.5) * 2.5, vy: Math.random() * vy, life: 0, max, color,
    });
  }

  const onGround = () => s.alt <= 0.5;
  function press() {
    if (!s.running || s.paused) return;
    s.hold = true;
    if (onGround()) doJump();
    else s.buffer = 7;   // toque un pelín antes de aterrizar: salta igual al tocar el suelo
  }
  function release() { s.hold = false; s.canBoost = false; }
  function doJump() {
    s.vy = JUMP_V; s.holdT = 0; s.canBoost = true;
    dust(8, 1.5, 22 + Math.random() * 8, 'rgba(180,180,200,0.6)'); SFX.jump();
  }
  function drop() { if (s.running && !s.paused && !onGround()) { s.vy = Math.min(s.vy, DROP_V); s.hold = false; } }

  function showOverlay(kind) {
    const ico = $('ov-ico'), k = $('ov-kicker');
    overlay.dataset.kind = kind;
    ico.style.display = '';
    k.classList.toggle('bad', kind === 'over');
    $('ov-score').style.display = kind === 'over' ? '' : 'none';
    $('ov-best').style.display = kind === 'over' ? '' : 'none';
    paintOverlay();
    overlay.classList.remove('hidden');
    if (!TOUCH) playBtn.focus({ preventScroll: true });
  }

  function start() {
    Object.assign(s, { alt: 0, vy: 0, hold: false, holdT: 0, canBoost: false, obs: [], particles: [], score: 0, dist: 0, speed: SPEED0,
      next: SPEED0 * 80, over: false, running: true, paused: false, frame: 0, buffer: 0, shake: 0, mile: 0, mileT: 0, tips: {} });
    overlay.classList.add('hidden'); playBtn.blur();
    $('hint').textContent = TX.play;
    stage.classList.add('live'); pauseBtn.hidden = false;
    hud();
    last = performance.now(); acc = 0;
    JetSong.setIntensity(0); SFX.start();
    if (!best) tip('tipHold', 1);
  }

  function pause(on) {
    if (!s.running || s.paused === on) return;
    s.paused = on; s.hold = false;
    if (on) { SFX.pause(); showOverlay('pause'); }
    else { overlay.classList.add('hidden'); playBtn.blur(); last = performance.now(); acc = 0; }
  }

  function crash() {
    for (let i = 0; i < 22; i++) s.particles.push({
      x: AX + ASIZE / 2, alt: s.alt + ASIZE / 2, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
      life: 0, max: 34, color: i % 2 ? '#ef4444' : '#fbbf24',
    });
    s.running = false; s.over = true; s.overAt = performance.now(); s.hold = false;
    s.shake = RM.matches ? 0 : 14;
    SFX.hit(); JetSong.setIntensity(0);
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    const record = s.score > best;
    s.lastRecord = record;
    if (record) { best = s.score; try { localStorage.setItem(BEST_KEY, String(best)); } catch (e) {} }
    $('ov-score').textContent = `${s.score} ${TX.pts}`;
    $('ov-best').innerHTML = record && best > 0 ? `<b>${TX.newBest}</b>` : `${TX.best}: <b>${best}</b>`;
    $('hint').textContent = '';
    pauseBtn.hidden = true; stage.classList.remove('live');
    hud();
    setTimeout(() => { if (s.over) showOverlay('over'); }, 450);
  }

  function hud() {
    hudS.textContent = s.score;
    hudB.textContent = `${TX.best.toUpperCase()} ${Math.max(best, s.score)}`;
  }

  let tipTimer = 0;
  function tip(key, delay) {
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => {
      tipEl.dataset.key = key; tipEl.textContent = TX[key]; tipEl.classList.add('on');
      tipTimer = setTimeout(() => tipEl.classList.remove('on'), 2600);
    }, (delay || 0) * 1000);
  }

  // ── Obstáculos: rocas sueltas, grupos de rocas (piden salto alto) y meteoritos en vuelo a tres alturas ──
  function rockShape(w, h, rnd) {
    const shape = [];
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2, r = 0.85 + rnd() * 0.3;
      shape.push([Math.cos(ang) * (w / 2) * r, Math.sin(ang) * (h / 2) * r]);
    }
    const craters = Array.from({ length: 2 + Math.floor(rnd() * 2) }, () => ({
      cx: (rnd() - 0.5) * w * 0.5, cy: (rnd() - 0.5) * h * 0.5, r: 1 + rnd() * 2,
    }));
    return { shape, craters };
  }
  function rock(x, w, h) {
    return Object.assign({ kind: 'rock', x, alt: h / 2, w, h, rot: 0, rotSpeed: (Math.random() - 0.5) * 0.04, pts: 1 }, rockShape(w, h, Math.random));
  }
  function spawn() {
    const sc = s.score, R = Math.random, x0 = W + 20;
    const pool = [['rock', 10]];
    if (sc >= 6) pool.push(['pair', 4]);
    if (sc >= 18) pool.push(['trio', 2.5]);
    if (sc >= 12) pool.push(['mLow', 2], ['mMid', 2.5]);
    if (sc >= 26) pool.push(['combo', 2.2]);
    let tot = 0; for (const p of pool) tot += p[1];
    let pick = R() * tot, kind = 'rock';
    for (const p of pool) { if ((pick -= p[1]) < 0) { kind = p[0]; break; } }
    let width;
    if (kind === 'rock') {
      const tall = sc < 8 ? 0.45 : 1;
      const h = 22 + R() * 26 * tall, w = 18 + R() * 14;
      s.obs.push(rock(x0 + w / 2, w, h)); width = w;
    } else if (kind === 'pair' || kind === 'trio') {
      const n = kind === 'pair' ? 2 : 3; let x = x0;
      for (let i = 0; i < n; i++) { const w = 16 + R() * 6, h = 20 + R() * 12; s.obs.push(rock(x + w / 2, w, h)); x += w * 0.82; }
      width = x - x0;
      if (!s.tips.hold && !best) { s.tips.hold = 1; tip('tipHold'); }
    } else if (kind === 'combo') {
      // roca baja con un meteorito alto encima: hay que hacer un salto corto
      const w = 18 + R() * 8, h = 20 + R() * 8;
      s.obs.push(rock(x0 + w / 2, w, h));
      s.obs.push(meteor(x0 + w / 2 + 6, 96, 1));
      width = w;
    } else {
      s.obs.push(meteor(x0 + 110, kind === 'mLow' ? 16 : 47, 1.18)); width = 30;
      if (kind === 'mMid' && !s.tips.meteor && best < 40) { s.tips.meteor = 1; tip('tipMeteor'); }
    }

    const lo = 36 - Math.min(6, sc / 20), hi = lo + 42 - Math.min(24, sc / 3);
    s.next = width + s.speed * (lo + R() * (hi - lo)) + (kind === 'mLow' || kind === 'mMid' ? 90 : 0);
  }
  function meteor(x, alt, rel) {
    const r = 9 + Math.random() * 2.5;
    return Object.assign({ kind: 'met', x, alt, w: r * 2, h: r * 2, r, rel, rot: 0, rotSpeed: 0.08, pts: 1, warned: false },
      rockShape(r * 2, r * 2, Math.random));
  }

  // ── Paso de física ──
  function step() {
    s.frame++;
    const wasInAir = !onGround();
    // jetpack: mientras se mantiene, la gravedad pesa menos durante unos cuadros
    let g = G;
    if (s.vy > 0) {
      s.holdT++;
      if (s.hold && s.canBoost && s.holdT > HOLD_FROM && s.holdT <= HOLD_MAX) { g = G_HOLD; if (s.holdT === HOLD_FROM + 1) SFX.boost(); }
    }
    s.vy -= g; s.alt += s.vy;
    if (s.alt <= 0) {
      s.alt = 0; s.vy = 0;
      if (wasInAir) { dust(6, 0.8, 16, 'rgba(160,160,180,0.5)'); if (s.buffer <= 0) SFX.land(); }
      if (s.buffer > 0) { s.buffer = 0; doJump(); }
    }
    if (s.buffer > 0) s.buffer--;

    // velocidad: sube rápido al principio y se estabiliza (tope ≈ 8)
    s.speed = SPEED0 + SPEED_ADD * (1 - Math.exp(-s.dist / SPEED_K));
    s.dist += s.speed;
    s.next -= s.speed;
    if (s.next <= 0) spawn();

    if (onGround()) s.runPh += 0.16 + s.speed * 0.035;
    let gained = 0;
    s.obs = s.obs.filter(a => {
      a.x -= s.speed * (a.rel || 1); a.rot += a.rotSpeed;
      if (a.kind === 'met' && !a.warned && a.x - a.r < W + 70) { a.warned = true; SFX.warn(); }
      if (a.x + a.w / 2 < AX - 6 && !a.passed) { a.passed = true; gained += a.pts; }
      return a.x + a.w > -30;
    });
    if (gained) {
      const before = s.score; s.score += gained; hud();
      if (Math.floor(s.score / 50) > Math.floor(before / 50)) { s.mile = Math.floor(s.score / 50) * 50; s.mileT = 90; SFX.mile(); }
      else if (Math.floor(s.score / 10) > Math.floor(before / 10)) SFX.point();
    }
    if (s.mileT > 0) s.mileT--;
    JetSong.setIntensity((s.speed - SPEED0) / SPEED_ADD);
    for (const st of s.starsFront) { st.x -= st.vx; if (st.x < -2) { st.x = W + 2; st.y = Math.random() * (GROUND - 20); } }
    for (const cr of s.craters) { cr.x -= s.speed * (0.6 + cr.d * 0.5); if (cr.x < -8) cr.x += W * 1.2; }
    s.ridgeX += s.speed * 0.18;

    // chispas del jetpack al subir
    if (s.vy > 1 && Math.random() < (s.hold ? 0.8 : 0.4)) s.particles.push({
      x: AX + 6 + (Math.random() - 0.5) * 4, alt: s.alt + 4,
      vx: (Math.random() - 0.5) * 1.5, vy: -(1 + Math.random() * 1.5), life: 0, max: 12, color: '#fbbf24',
    });

    // colisión con cajas algo más chicas que el dibujo (perdona los roces)
    const px1 = AX + 4, px2 = AX + ASIZE - 4, py1 = s.alt + 4, py2 = s.alt + ASIZE - 4;
    for (const a of s.obs) {
      const ins = a.kind === 'met' ? 3 : 5;
      const ax1 = a.x - a.w / 2 + ins, ax2 = a.x + a.w / 2 - ins, ay1 = a.alt - a.h / 2 + ins, ay2 = a.alt + a.h / 2 - ins;
      if (px1 < ax2 && px2 > ax1 && py1 < ay2 && py2 > ay1) { crash(); return; }
    }
  }

  function stepParticles() {
    s.particles = s.particles.filter(p => { p.life++; p.x += p.vx; p.alt += p.vy; p.vy -= 0.08; return p.life < p.max; });
    if (s.shake > 0) s.shake--;
  }

  function rr(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fill();
  }

  // ── Dibujo (el mismo arte del onboarding de JET, con más cielo en vertical) ──
  function draw() {
    ctx.save();
    if (s.shake > 0) ctx.translate((Math.random() - 0.5) * s.shake * 0.5, (Math.random() - 0.5) * s.shake * 0.5);
    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#020208'); bg.addColorStop(0.5, '#080b1a'); bg.addColorStop(1, '#0a0d20');
    ctx.fillStyle = bg; ctx.fillRect(-10, -10, W + 20, H + 20);

    ctx.save(); ctx.globalAlpha = TALL ? 0.11 : 0.08;
    const neb = ctx.createRadialGradient(W * 0.26, GROUND * 0.38, 0, W * 0.26, GROUND * 0.38, TALL ? 160 : 90);
    neb.addColorStop(0, '#7700f4'); neb.addColorStop(1, 'transparent');
    ctx.fillStyle = neb; ctx.fillRect(0, 0, W, GROUND);
    const neb2 = ctx.createRadialGradient(W * 0.78, GROUND * 0.56, 0, W * 0.78, GROUND * 0.56, TALL ? 170 : 100);
    neb2.addColorStop(0, '#00f2cf'); neb2.addColorStop(1, 'transparent');
    ctx.fillStyle = neb2; ctx.fillRect(0, 0, W, GROUND);
    ctx.restore();

    for (const st of s.starsBack) {
      const tw = RM.matches ? 0.5 : (Math.sin(s.frame * 0.04 + st.phase) + 1) / 2;
      ctx.fillStyle = `rgba(255,255,255,${0.25 + tw * 0.5})`;
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = 'rgba(220,230,255,0.85)';
    for (const st of s.starsFront) { ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill(); }

    // Júpiter con bandas y gran mancha roja
    ctx.save();
    const jr = TALL ? 54 : 40, jx = W - (TALL ? 82 : 80), jy = TALL ? Math.max(120, GROUND * 0.40) : 50, k = jr / 40;
    const glow = ctx.createRadialGradient(jx, jy, jr, jx, jy, jr + 25 * k);
    glow.addColorStop(0, 'rgba(251,146,60,0.25)'); glow.addColorStop(1, 'transparent');
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(jx, jy, jr + 25 * k, 0, Math.PI * 2); ctx.fill();
    const jb = ctx.createRadialGradient(jx - 12 * k, jy - 12 * k, 5, jx, jy, jr);
    jb.addColorStop(0, '#fdba74'); jb.addColorStop(0.5, '#fb923c'); jb.addColorStop(1, '#7c2d12');
    ctx.fillStyle = jb; ctx.beginPath(); ctx.arc(jx, jy, jr, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(jx, jy, jr, 0, Math.PI * 2); ctx.clip();
    for (const b of [[-28, 4, 'rgba(124,45,18,0.5)'], [-15, 6, 'rgba(180,83,9,0.4)'], [-3, 8, 'rgba(154,52,18,0.4)'], [10, 4, 'rgba(124,45,18,0.45)'], [20, 6, 'rgba(180,83,9,0.4)']]) {
      ctx.fillStyle = b[2]; ctx.fillRect(jx - jr, jy + b[0] * k, jr * 2, b[1] * k);
    }
    ctx.fillStyle = 'rgba(180,40,30,0.6)';
    ctx.beginPath(); ctx.ellipse(jx + 8 * k, jy + 4 * k, 9 * k, 5 * k, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // cordillera lejana (parallax lento)
    ctx.fillStyle = 'rgba(46,30,84,0.55)';
    ctx.beginPath(); ctx.moveTo(0, GROUND);
    const seg = 34, off = s.ridgeX % seg, i0 = Math.floor(s.ridgeX / seg);
    for (let i = 0; i * seg - off <= W + seg; i++) ctx.lineTo(i * seg - off, GROUND - s.ridge[(i0 + i) % s.ridge.length]);
    ctx.lineTo(W + seg, GROUND); ctx.closePath(); ctx.fill();

    // Suelo
    const gg = ctx.createLinearGradient(0, GROUND, 0, H);
    gg.addColorStop(0, 'rgba(40,30,60,0.97)'); gg.addColorStop(1, 'rgba(12,8,22,0.97)');
    ctx.fillStyle = gg; ctx.fillRect(-10, GROUND, W + 20, H - GROUND + 10);
    ctx.fillStyle = 'rgba(119,0,244,0.6)'; ctx.fillRect(0, GROUND - 1, W, 1);
    ctx.fillStyle = 'rgba(0,242,207,0.15)'; ctx.fillRect(0, GROUND, W, 1);
    ctx.lineWidth = 0.5;
    for (const cr of s.craters) {
      if (cr.x < -8 || cr.x > W + 8) continue;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(cr.x, cr.y, cr.r, cr.r * (0.45 + cr.d * 0.3), 0, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(119,0,244,0.25)'; ctx.stroke();
    }

    drawAstronaut();

    for (const a of s.obs) {
      const y = GROUND - a.alt;
      if (a.kind === 'met') {
        if (a.x - a.r > W) {   // aviso en el borde: llega un meteorito a esta altura
          const p = 0.55 + 0.45 * Math.sin(s.frame * 0.4);
          ctx.fillStyle = `rgba(255,90,90,${p})`;
          ctx.beginPath(); ctx.moveTo(W - 4, y - 7); ctx.lineTo(W - 13, y); ctx.lineTo(W - 4, y + 7); ctx.closePath(); ctx.fill();
          continue;
        }
        const tl = 26 + a.r * 2;
        const tr = ctx.createLinearGradient(a.x, 0, a.x + tl, 0);
        tr.addColorStop(0, 'rgba(251,146,60,0.85)'); tr.addColorStop(0.4, 'rgba(239,68,68,0.45)'); tr.addColorStop(1, 'rgba(119,0,244,0)');
        ctx.fillStyle = tr; ctx.beginPath(); ctx.moveTo(a.x, y - a.r * 0.9); ctx.quadraticCurveTo(a.x + tl, y, a.x, y + a.r * 0.9); ctx.fill();
      }
      ctx.save(); ctx.translate(a.x, y); ctx.rotate(a.rot);
      const rg = ctx.createRadialGradient(-2, -2, 1, 0, 0, Math.max(a.w, a.h) / 2);
      if (a.kind === 'met') { rg.addColorStop(0, '#fdba74'); rg.addColorStop(0.5, '#9a3412'); rg.addColorStop(1, '#2a0f0a'); }
      else { rg.addColorStop(0, '#64748b'); rg.addColorStop(0.6, '#334155'); rg.addColorStop(1, '#0f172a'); }
      ctx.fillStyle = rg; ctx.beginPath();
      a.shape.forEach((v, i) => i ? ctx.lineTo(v[0], v[1]) : ctx.moveTo(v[0], v[1]));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = a.kind === 'met' ? 'rgba(251,146,60,0.7)' : 'rgba(119,0,244,0.5)'; ctx.lineWidth = 1; ctx.stroke();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      for (const cr of a.craters) { ctx.beginPath(); ctx.arc(cr.cx, cr.cy, cr.r, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }

    for (const p of s.particles) {
      ctx.globalAlpha = 1 - p.life / p.max; ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, GROUND - p.alt, 1.5, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // hito cada 50 puntos
    if (s.mileT > 0) {
      const t = s.mileT / 90;
      ctx.globalAlpha = Math.min(1, t * 3);
      ctx.textAlign = 'center'; ctx.fillStyle = '#00f2cf';
      ctx.font = `800 ${TALL ? 44 : 30}px Poppins, system-ui, sans-serif`;
      ctx.fillText(String(s.mile), W / 2, GROUND * (TALL ? 0.56 : 0.5) - (RM.matches ? 0 : (1 - t) * 10));
      ctx.globalAlpha = 1; ctx.textAlign = 'left';
    }
    ctx.restore();
  }

  // ── Astronauta oficial de JET//Games (copia de _shared/astronauta/astronauta-oficial.js, el de JET//Box) ──
  // Encapsulado para no chocar con el rr() del juego. Única adición: c.noShadow, porque la sombra la
  // dibuja el juego en el suelo (el oficial la pone bajo los pies, y en el aire quedaría flotando).
  const OFICIAL = (() => {
    let TS = 40;
    // Astronauta oficial de JET//Games (elegido el 2026-10-22): el de JET//Box.
    // Copiar tal cual en cada juego que muestre un astronauta. Coordenadas en unidades de 1/100 de casilla:
    // TS = tamaño en píxeles de la figura (≈ alto del cuerpo sin antenas), f = 'u'|'d'|'l'|'r', ph = fase de paso,
    // moving/push = 0..1, tm = segundos, hop = salto (0 = en el suelo).
    function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

    function drawAstro(c,cx,cy,f,ph,moving,push,tm,hop){
     const S=TS,u=S/100;
     const bob=moving?-Math.abs(Math.sin(ph))*4:Math.sin(tm*2.2)*1.1;
     const jump=hop>0?-Math.abs(Math.sin(hop*9))*16*Math.max(0,1-hop/1.6):0;
     // shadow
     if(!c.noShadow){c.fillStyle='rgba(0,0,0,'+(0.38-(jump?.12:0))+')';c.beginPath();c.ellipse(cx,cy+38*u,(24+jump*.3)*u,7*u,0,0,7);c.fill();}
     c.save();c.translate(cx,cy+(bob+jump)*u);c.scale(u,u);
     const side=f==='l'||f==='r';if(f==='l')c.scale(-1,1);
     const lean=push*7;if(side)c.translate(lean,0);else c.translate(0,f==='d'?lean*.5:-lean*.5);
     const OUT='rgba(10,5,18,.6)';c.lineWidth=2.2;c.strokeStyle=OUT;c.lineJoin='round';
     const suit=c.createLinearGradient(-20,-10,20,30);suit.addColorStop(0,'#ffffff');suit.addColorStop(1,'#c7cee3');
     const s1=Math.sin(ph),l1=moving?Math.max(0,s1)*5:0,l2=moving?Math.max(0,-s1)*5:0;
     // legs
     c.fillStyle=suit;
     if(side){const a=moving?s1*6:0;rr(c,-9+a,20,11,17,5);c.fill();c.stroke();rr(c,1-a,20,11,17,5);c.fill();c.stroke();c.fillStyle='#8f97b8';rr(c,-9+a,31,12,6,3);c.fill();rr(c,1-a,31,12,6,3);c.fill();}
     else{rr(c,-14,20-l1,11,17,5);c.fill();c.stroke();rr(c,3,20-l2,11,17,5);c.fill();c.stroke();c.fillStyle='#8f97b8';rr(c,-14,31-l1,11,6,3);c.fill();rr(c,3,31-l2,11,6,3);c.fill();}
     // backpack
     const pack=(x,y,w,h)=>{const g=c.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,'#d9deef');g.addColorStop(1,'#9aa2c4');c.fillStyle=g;rr(c,x,y,w,h,6);c.fill();c.stroke();};
     if(f==='u'){pack(-21,-6,42,30);c.fillStyle='#00f2cf';rr(c,-12,2,7,13,2);c.fill();c.fillStyle='#fdd835';rr(c,-2,2,7,13,2);c.fill();c.fillStyle=(Math.sin(tm*5)>0)?'#ff5a7a':'#5a2340';c.beginPath();c.arc(12,8,3,0,7);c.fill();}
     else if(side){pack(-29,-6,15,28);c.fillStyle='#00f2cf';rr(c,-26,0,4,12,2);c.fill();}
     else{c.fillStyle='#aab1cc';rr(c,-24,-2,6,20,3);c.fill();c.stroke();rr(c,18,-2,6,20,3);c.fill();c.stroke();}
     // body
     c.fillStyle=suit;rr(c,-17,-6,34,32,12);c.fill();c.stroke();
     if(f==='d'){c.fillStyle='#24164a';rr(c,-8,4,16,11,3);c.fill();c.fillStyle='#00f2cf';c.beginPath();c.arc(-3.5,9.5,2,0,7);c.fill();c.fillStyle='#fdd835';c.beginPath();c.arc(3.5,9.5,2,0,7);c.fill();c.fillStyle='#7700f4';rr(c,-17,18,34,4,2);c.fill();}
     else if(side){c.fillStyle='#7700f4';rr(c,-17,18,34,4,2);c.fill();c.fillStyle='#24164a';rr(c,4,5,9,8,2);c.fill();c.fillStyle='#00f2cf';c.beginPath();c.arc(8.5,9,1.8,0,7);c.fill();}
     else{c.fillStyle='#7700f4';rr(c,-17,18,34,4,2);c.fill();}
     // arms
     c.fillStyle=suit;
     if(side){
      if(push>.3){rr(c,4,4,26,10,5);c.fill();c.stroke();c.fillStyle='#8f97b8';c.beginPath();c.arc(31,9,6,0,7);c.fill();c.stroke();}
      else{const sw=moving?-s1*5:0;c.save();c.translate(1,2);c.rotate(sw*.06);rr(c,-5,0,10,20,5);c.fill();c.stroke();c.fillStyle='#8f97b8';c.beginPath();c.arc(0,21,5,0,7);c.fill();c.restore();}
     }else{
      const fw=push>.3;const ay=fw?(f==='d'?14:-2):2;const sw=moving&&!fw?s1*3:0;
      [-1,1].forEach(sg=>{c.fillStyle=suit;rr(c,sg*21-5,ay+sg*sw,10,fw?14:20,5);c.fill();c.stroke();c.fillStyle='#8f97b8';c.beginPath();c.arc(sg*21,ay+sg*sw+(fw?15:21),5,0,7);c.fill();});
     }
     // helmet
     const hg=c.createRadialGradient(-7,-28,3,0,-17,25);hg.addColorStop(0,'#ffffff');hg.addColorStop(1,'#cdd3e8');
     c.fillStyle='#8f97b8';rr(c,-13,-6,26,6,3);c.fill();
     c.fillStyle=hg;c.beginPath();c.arc(0,-18,22,0,7);c.fill();c.stroke();
     // antenna
     // two symmetric antennas (side view: near one in front, far one slightly behind)
     const ants=side?[[-12,-35,-16,-45],[-3,-39,-6,-49]]:[[-10,-36,-14,-46],[10,-36,14,-46]];
     const on=Math.sin(tm*4)>-.2;
     ants.forEach(([x1,y1,x2,y2])=>{c.strokeStyle='#8f97b8';c.lineWidth=2.4;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke();
      c.fillStyle=on?'#fdd835':'#7a6a20';c.beginPath();c.arc(x2,y2-1,3.2,0,7);c.fill();});
     c.strokeStyle=OUT;c.lineWidth=2.2;
     if(f!=='u'){
      const vx=side?7:0,vw=side?13:16,vh=12;const vg=c.createLinearGradient(vx-vw,-30,vx+vw,-6);vg.addColorStop(0,'#5ffff0');vg.addColorStop(.45,'#00b8c8');vg.addColorStop(1,'#3a1690');
      c.fillStyle=vg;c.beginPath();c.ellipse(vx,-17,vw,vh,0,0,7);c.fill();c.stroke();
      c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.ellipse(vx-vw*.42,-22,vw*.28,vh*.22,-.5,0,7);c.fill();
      c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(vx+vw*.45,-11,vw*.12,vh*.12,0,0,7);c.fill();
     }else{c.strokeStyle='rgba(120,128,165,.6)';c.lineWidth=2;for(let k=-1;k<=1;k++){c.beginPath();c.moveTo(k*7,-26);c.lineTo(k*7,-14);c.stroke();}}
     c.restore();
    }

    return (c, cx, cy, size, f, ph, moving, push, tm, hop) => { TS = size; drawAstro(c, cx, cy, f, ph, moving, push, tm, hop); };
  })();

  // La figura oficial mide de casco (-40) a botas (+37) en unidades de 1/100 de TS: se escala para ocupar
  // exactamente el hueco de colisión de ASIZE×ASIZE (la caja y la física no cambian).
  const A_TS = ASIZE / 0.77, A_U = A_TS / 100;
  function drawAstronaut() {
    const ground = onGround() && s.running;
    const top = GROUND - s.alt - ASIZE;
    const cx = AX + ASIZE / 2, cy = top + 40 * A_U;
    // sombra en el suelo: se achica y aclara con la altura
    const k = Math.max(0.25, 1 - s.alt / 90);
    ctx.fillStyle = `rgba(0,0,0,${0.38 * k})`;
    ctx.beginPath(); ctx.ellipse(cx, GROUND + 1, 22 * A_U * (0.6 + 0.4 * k), 6 * A_U, 0, 0, Math.PI * 2); ctx.fill();
    // llama del jetpack (sale de la mochila, detrás del cuerpo) al subir; más larga mientras se mantiene
    if (s.vy > 1 && !s.over) {
      const fx = cx - 21.5 * A_U, fy = cy + 22 * A_U, len = (s.hold && s.canBoost && s.holdT <= HOLD_MAX ? 17 : 10) + Math.random() * 6;
      const f1 = ctx.createLinearGradient(0, fy, 0, fy + len);
      f1.addColorStop(0, '#22d3ee'); f1.addColorStop(0.5, '#7c3aed'); f1.addColorStop(1, 'transparent');
      ctx.fillStyle = f1; ctx.beginPath(); ctx.moveTo(fx - 4, fy); ctx.quadraticCurveTo(fx, fy + len + 4, fx + 4, fy); ctx.fill();
      const f2 = ctx.createLinearGradient(0, fy, 0, fy + len * 0.7);
      f2.addColorStop(0, '#fff'); f2.addColorStop(1, 'transparent');
      ctx.fillStyle = f2; ctx.beginPath(); ctx.moveTo(fx - 1.6, fy); ctx.quadraticCurveTo(fx, fy + len * 0.6, fx + 1.6, fy); ctx.fill();
    }
    ctx.save(); ctx.noShadow = true;
    if (s.over) { ctx.translate(cx, cy); ctx.rotate(-0.5); ctx.translate(-cx, -cy); }
    OFICIAL(ctx, cx, cy, A_TS, 'r', s.runPh, ground ? 1 : 0, 0, s.frame / 60, 0);
    ctx.noShadow = false; ctx.restore();
  }

  // Astronauta oficial en el cartel (de frente, flotando; tras un impacto, girando con un halo rojo)
  const ovc = $('ov-astro'), ovx = ovc.getContext('2d');
  { const d = Math.min(window.devicePixelRatio || 1, 3); ovc.width = ovc.height = Math.round(64 * d); }
  function drawOv() {
    if (overlay.classList.contains('hidden') || !ovc.offsetParent) return;
    const w = ovc.width, t = performance.now() / 1000;
    ovx.setTransform(1, 0, 0, 1, 0, 0); ovx.clearRect(0, 0, w, w);
    if (s.over) {
      const g = ovx.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
      g.addColorStop(0, 'rgba(255,68,102,0.35)'); g.addColorStop(1, 'rgba(255,68,102,0)');
      ovx.fillStyle = g; ovx.fillRect(0, 0, w, w);
      ovx.translate(w / 2, w / 2); ovx.rotate(RM.matches ? -0.4 : Math.sin(t * 1.6) * 0.5 - 0.3); ovx.translate(-w / 2, -w / 2);
    }
    ovx.noShadow = true;
    OFICIAL(ovx, w / 2, w * 0.52, w * 0.74, 'd', 0, 0, 0, t, 0);
  }

  // ── Bucle con paso fijo ──
  let last = performance.now(), acc = 0;
  function loop(now) {
    acc += Math.min(now - last, 250); last = now;
    let n = 0;
    while (acc >= STEP && n < 5) {
      if (s.running && !s.paused) step(); else if (!s.paused) s.frame++;
      if (!s.paused) stepParticles();
      acc -= STEP; n++;
    }
    if (n === 5) acc = 0;
    draw(); drawOv();
    requestAnimationFrame(loop);
  }

  // ── Entrada: toda la pantalla es botón (en vertical el pulgar queda lejos de la franja de juego) ──
  const canRestart = () => s.over && performance.now() - s.overAt > 600;
  function primary() {
    if (s.paused) { pause(false); return; }
    if (s.running) { press(); return; }
    if (!s.over || canRestart()) start();
  }
  const UI_SEL = '#back, #play, #snd, #pause, .lang-seg';
  document.addEventListener('pointerdown', e => {
    if (e.button > 0 || e.target.closest(UI_SEL)) return;
    e.preventDefault();
    primary();
  });
  const up = () => { if (s.hold) release(); };
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
  playBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (s.paused) pause(false); else if (!s.over || canRestart()) start();
  });
  pauseBtn.addEventListener('click', e => { e.stopPropagation(); pause(!s.paused); pauseBtn.blur(); });
  const JUMP_KEYS = ['Space', 'ArrowUp', 'KeyW'];
  window.addEventListener('keydown', e => {
    if (e.target.closest && e.target.closest('.ja, .lang-seg')) return;   // teclas dentro del panel de sonido o del selector de idioma
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (s.running) { e.preventDefault(); pause(!s.paused); }
      return;
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); drop(); return; }
    if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') {
      if (e.target === playBtn && (e.code === 'Space' || e.code === 'Enter')) return;   // el botón ya hace su clic
      e.preventDefault();
      if (e.repeat) return;
      primary();
    }
  });
  window.addEventListener('keyup', e => { if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') up(); });
  // pausa automática al ocultar la pestaña o perder el foco
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(true); last = performance.now(); acc = 0; });
  window.addEventListener('blur', () => pause(true));
  document.addEventListener('contextmenu', e => { if (!e.target.closest(UI_SEL)) e.preventDefault(); });
  let rz = 0;
  const relayout = () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(layout); };
  window.addEventListener('resize', relayout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 150));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(relayout);

  // gancho de pruebas, como window.RAID
  window.ASTRO = { state: s, start, press, release, drop, pause, step, get dims() { return { W, H, GROUND, AX, TALL }; } };

  // Vista de muestra para la tarjeta de la home: ?demo
  if (best > 0) $('ov-best').style.display = '';
  applyLang();
  seedScenery(); layout(); hud();
  if (/[?&]demo/.test(location.search)) {
    overlay.classList.add('hidden'); $('back').style.display = 'none'; $('snd').style.display = 'none';
    s.score = 27; s.alt = 38; s.vy = 4; s.frame = 40; hud();
    for (const [x, h, w] of [[W * 0.42, 40, 26], [W * 0.68, 30, 22], [W * 0.92, 46, 30]]) {
      const shape = []; for (let i = 0; i < 8; i++) { const ang = i / 8 * Math.PI * 2, r = 0.88 + ((i * 37) % 10) / 40; shape.push([Math.cos(ang) * w / 2 * r, Math.sin(ang) * h / 2 * r]); }
      s.obs.push({ kind: 'rock', x, alt: h / 2, w, h, rot: 0.3, rotSpeed: 0, shape, craters: [{ cx: -3, cy: -4, r: 2.2 }, { cx: 4, cy: 5, r: 1.5 }] });
    }
    draw();
    return;
  }
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
})();
</script>
</body>
</html>
