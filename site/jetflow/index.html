<script>
/* Puente de mudanza (2026-10-22): JET//Flow ahora vive en https://jetgames.fun/flow/.
   Este origen (jetflow.jetgames.fun) tiene su propio localStorage: se manda entero en #jet-migrar=
   y el juego nuevo importa solo las claves que aún no tiene. Se conservan la ruta y la consulta. */
(function () {
  var dest = 'https://jetgames.fun/flow/' + location.search;
  var d = {}, n = 0;
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); d[k] = localStorage.getItem(k); n++; } } catch (e) {}
  if (n) { try { dest += '#jet-migrar=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(d))))); } catch (e) {} }
  location.replace(dest);
})();
</script>
