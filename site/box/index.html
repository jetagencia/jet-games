<script>
/* JET//Games — idioma único para todo el sitio (2026-10-22).
   Copiar tal cual al principio de cada juego (antes de pintar textos).
   Prioridad: ?lang=es|en en la URL  >  elección guardada (cookie de .jetgames.fun + localStorage)  >  idioma del navegador.
   La elección se comparte entre la portada y todos los juegos porque la cookie vale para todo jetgames.fun. */
(function () {
  'use strict';
  var KEY = 'jet_lang';
  var OK = { es: 1, en: 1 };

  function leerCookie() {
    var m = document.cookie.match(/(?:^|;\s*)jet_lang=(es|en)\b/);
    return m ? m[1] : null;
  }
  function guardar(lang) {
    var dominio = /(^|\.)jetgames\.fun$/.test(location.hostname) ? '; domain=.jetgames.fun' : '';
    var seguro = location.protocol === 'https:' ? '; Secure' : '';
    try { document.cookie = KEY + '=' + lang + '; path=/; max-age=31536000; SameSite=Lax' + dominio + seguro; } catch (e) {}
    try { localStorage.setItem(KEY, lang); } catch (e) {}
  }
  function delNavegador() {
    var l = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    return /^es\b/i.test(l) ? 'es' : 'en';
  }

  var desdeUrl = (location.search.match(/[?&]lang=(es|en)\b/) || [])[1] || null;
  var guardado = leerCookie();
  if (!guardado) { try { var ls = localStorage.getItem(KEY); if (OK[ls]) guardado = ls; } catch (e) {} }
  var actual = desdeUrl || guardado || delNavegador();
  if (desdeUrl || (guardado && !leerCookie())) guardar(actual);
  document.documentElement.lang = actual;

  window.JETIdioma = {
    get: function () { return actual; },
    /* Cambia el idioma, lo recuerda para todo el sitio y avisa con el evento 'jet-idioma'. */
    set: function (lang) {
      if (!OK[lang] || lang === actual) return;
      actual = lang; guardar(lang);
      document.documentElement.lang = lang;
      try { window.dispatchEvent(new CustomEvent('jet-idioma', { detail: lang })); } catch (e) {}
    },
  };
})();
</script>

<script>
/* JetSong · motor de música propia de JET//Games (Web Audio puro, sin samples ni archivos).
   Canción = secciones (acordes por compás, bajo, batería, melodía, arpegio) + orden con bucle. */
const JetSong=(()=>{
 let ac=null,out,mus,sfx,rev,nbuf,song=null,timer=0,run=false,nextT=0,pos=null,inten=0,leads={};
 const NT={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
 const md=n=>{const m=/^([A-G])(#|b)?(-?\d)$/.exec(n);return m?NT[m[1]]+(m[2]==='#'?1:m[2]==='b'?-1:0)+(+m[3]+1)*12:null;};
 const hz=m=>440*Math.pow(2,(m-69)/12);
 function imp(sec,dec){const L=Math.floor(ac.sampleRate*sec),b=ac.createBuffer(2,L,ac.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<L;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/L,dec);}return b;}
 function build(ctx){
  ac=ctx;out=ac.createDynamicsCompressor();out.threshold.value=-12;out.ratio.value=3.5;out.attack.value=.004;out.release.value=.2;out.connect(ac.destination);
  mus=ac.createGain();mus.gain.value=0;sfx=ac.createGain();sfx.gain.value=.8;mus.connect(out);sfx.connect(out);
  rev=ac.createConvolver();rev.buffer=imp(2.8,3);const rg=ac.createGain();rg.gain.value=.32;rev.connect(rg);rg.connect(mus);
  nbuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 }
 // ── voces ──
 function env(g,t,a,v,end){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,end);}
 function tail(node,amt){node.connect(mus);if(amt){const s=ac.createGain();s.gain.value=amt;node.connect(s);s.connect(rev);}}
 function osc(type,f,t,end,det){const o=ac.createOscillator();o.type=type;o.frequency.value=f;if(det)o.detune.value=det;o.start(t);o.stop(end+.05);return o;}
 const V={
  pad(t,ms,dur,v,o={}){const end=t+dur+(o.rel||.8);const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=.6;f.frequency.setValueAtTime(o.cut||900,t);f.frequency.linearRampToValueAtTime((o.cut||900)*1.6,t+dur*.5);f.frequency.linearRampToValueAtTime(o.cut||900,t+dur);
   const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.att||.5));g.gain.setValueAtTime(v,t+dur);g.gain.exponentialRampToValueAtTime(.0001,end);f.connect(g);tail(g,o.rv??.5);
   const pv=1/ms.length;ms.forEach(m=>[-9,9].forEach(dt=>{const x=osc(o.w||'sawtooth',hz(m),t,end,dt);const a=ac.createGain();a.gain.value=pv*.5;x.connect(a);a.connect(f);}));},
  bass(t,m,dur,v,o={}){const end=t+dur+.06;const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=o.q||4;f.frequency.setValueAtTime(o.cut||1400,t);f.frequency.exponentialRampToValueAtTime(o.cut2||220,t+Math.min(dur,.25));
   const g=ac.createGain();env(g,t,.006,v,end);osc(o.w||'sawtooth',hz(m),t,end).connect(f);f.connect(g);const s=ac.createGain();env(s,t,.006,v*.7,end);osc('sine',hz(m),t,end).connect(s);s.connect(mus);tail(g,0);},
  sub(t,m,dur,v){const end=t+dur+.3;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.08);g.gain.setValueAtTime(v,t+dur*.8);g.gain.exponentialRampToValueAtTime(.0001,end);osc('sine',hz(m),t,end).connect(g);const g2=ac.createGain();g2.gain.value=.18;osc('triangle',hz(m+12),t,end).connect(g2);g2.connect(g);tail(g,0);},
  pluck(t,m,dur,v,o={}){const end=t+Math.max(dur,.18)+.25;const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(o.cut||3800,t);f.frequency.exponentialRampToValueAtTime(500,t+.3);
   const g=ac.createGain();env(g,t,.004,v,end);osc(o.w||'square',hz(m),t,end).connect(f);f.connect(g);tail(g,o.rv??.3);},
  bell(t,m,dur,v,o={}){const end=t+Math.max(dur*1.5,.5)+.4;const c=osc('sine',hz(m),t,end);const mo=osc('sine',hz(m)*(o.ratio||3.5),t,end);const mg=ac.createGain();mg.gain.setValueAtTime(hz(m)*(o.idx||1.2),t);mg.gain.exponentialRampToValueAtTime(hz(m)*.05,t+.6);mo.connect(mg);mg.connect(c.frequency);
   const g=ac.createGain();env(g,t,.003,v,end);c.connect(g);tail(g,o.rv??.55);},
  keys(t,m,dur,v,o={}){V.bell(t,m,dur,v,{ratio:1,idx:o.idx||.9,rv:o.rv??.35});const g=ac.createGain();env(g,t,.004,v*.35,t+dur+.4);osc('triangle',hz(m),t,t+dur+.4).connect(g);tail(g,.2);},
  lead(t,m,dur,v,o={}){const end=t+dur+(o.rel||.12);const x=osc(o.w||'square',hz(m),t,end);const x2=osc('sawtooth',hz(m),t,end,o.det||7);
   const l=osc('sine',5.2,t,end);const lg=ac.createGain();lg.gain.setValueAtTime(0,t);lg.gain.linearRampToValueAtTime(hz(m)*.006,t+Math.min(.35,dur));l.connect(lg);lg.connect(x.frequency);lg.connect(x2.frequency);
   const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=1;f.frequency.setValueAtTime(o.cut||2600,t);const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.015);g.gain.setValueAtTime(v*.8,t+dur);g.gain.exponentialRampToValueAtTime(.0001,end);
   const a=ac.createGain();a.gain.value=.5;x.connect(a);x2.connect(a);a.connect(f);f.connect(g);tail(g,o.rv??.35);},
  brass(t,m,dur,v,o={}){const end=t+dur+(o.rel||.15);const f=ac.createBiquadFilter();f.type='lowpass';f.Q.value=1.5;f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(o.cut||2400,t+.06);f.frequency.exponentialRampToValueAtTime((o.cut||2400)*.5,t+Math.max(.1,dur));
   const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.03);g.gain.setValueAtTime(v*.85,t+dur);g.gain.exponentialRampToValueAtTime(.0001,end);
   [-6,6,0].forEach((dt,i)=>{const a=ac.createGain();a.gain.value=i<2?.4:.25;osc(i<2?'sawtooth':'square',hz(m)*(i<2?1:.5),t,end,dt).connect(a);a.connect(f);});f.connect(g);tail(g,o.rv??.3);},
  strings(t,m,dur,v,o={}){V.pad(t,[m],dur,v,{cut:o.cut||1800,att:o.att||.25,rel:o.rel||.5,rv:.5});},
 };
 function nz(t,dur,v,type,fq,q,dest){const s=ac.createBufferSource();s.buffer=nbuf;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=fq;f.Q.value=q||1;const g=ac.createGain();env(g,t,.002,v,t+dur);s.connect(f);f.connect(g);g.connect(dest||mus);s.start(t,Math.random()*.5);s.stop(t+dur+.05);return g;}
 const D={
  k(t,v){const g=ac.createGain();env(g,t,.002,v,t+.38);const o=osc('sine',150,t,t+.4);o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.14);o.connect(g);g.connect(mus);},
  s(t,v){nz(t,.18,v*.7,'bandpass',1900,.8);const g=ac.createGain();env(g,t,.002,v*.5,t+.12);const o=osc('triangle',190,t,t+.13);o.frequency.exponentialRampToValueAtTime(140,t+.1);o.connect(g);g.connect(mus);const r=nz(t,.25,v*.25,'bandpass',2400,.7);const s=ac.createGain();s.gain.value=.4;r.connect(s);s.connect(rev);},
  c(t,v){[0,.011,.022].forEach(d=>nz(t+d,.025,v*.6,'bandpass',1300,1.4));const g=nz(t+.03,.2,v*.5,'bandpass',1200,1);const s=ac.createGain();s.gain.value=.5;g.connect(s);s.connect(rev);},
  h(t,v){nz(t,.045,v*.5,'highpass',8000,.7);},
  o(t,v){nz(t,.26,v*.45,'highpass',7000,.7);},
  r(t,v){const g=ac.createGain();env(g,t,.001,v*.6,t+.05);osc('square',1700,t,t+.06).connect(g);const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=900;g.connect(f);f.connect(mus);},
  m(t,v){nz(t,.07,v*.45,'bandpass',5200,1.3);},
  t(t,v,p){const g=ac.createGain();env(g,t,.003,v,t+.35);const o=osc('sine',p||110,t,t+.36);o.frequency.setValueAtTime(p||110,t);o.frequency.exponentialRampToValueAtTime((p||110)*.55,t+.3);o.connect(g);tail(g,.25);nz(t,.06,v*.3,'lowpass',900,1);},
  T(t,v){D.t(t,v,165);},
  y(t,v){const g=nz(t,1.6,v*.35,'highpass',5000,.5);const s=ac.createGain();s.gain.value=.5;g.connect(s);s.connect(rev);},
 };
 // ── partitura ──
 const pick=(x,bar)=>Array.isArray(x)?x[bar%x.length]:x;
 function parseLead(str){const ev={};let s=0;if(!str)return ev;str.trim().split(/\s+/).forEach(tok=>{const[n,d]=tok.split(':');const len=+d||4;if(n!=='.'){ev[s]=[md(n),len];}s+=len;});return ev;}
 function prep(){leads={};for(const k in song.sec){const S=song.sec[k];leads[k]={a:parseLead(S.lead),b:parseLead(S.lead2)};S._ch=S.chords.map(c=>c.split(/\s+/).map(md));}}
 const gate=x=>x==null?null:typeof x==='object'&&!Array.isArray(x)?(inten>=(x.min||0)&&inten<=(x.max??9)?x.p:null):x;
 function stepAt(t,sd){
  const key=song.order[pos.o],S=song.sec[key],bar=pos.bar,s=pos.s,ch=S._ch[bar%S._ch.length],root=ch[0],L=song.lv||1;
  if(s===0&&S.pad!==false)V.pad(t,ch.slice(S.padFrom||0),16*sd,(S.padVol??song.padVol??.05)*L,song.padOpt||{});
  const bp=gate(pick(S.bass,bar));if(bp){const c=bp[s];const off={R:0,O:12,F:7,f:-5,m:3,M:4,s:10}[c];if(off!=null){let n=1;while(bp[s+n]==='_')n++;V[song.bassV||'bass'](t,root+off+(song.bassOct||0),n*sd*.92,(S.bassVol??song.bassVol??.16)*L,song.bassOpt||{});}}
  if(S.drums)for(const k in S.drums){const p=gate(pick(S.drums[k],bar));if(!p)continue;const c=p[s];if(c&&c!=='-'&&c!=='.'){const v=(c==='X'?1.25:c==='g'?.45:1)*(song.dv?.[k]??.3)*L;(D[k])(t+(s%2?sd*(song.swing||0):0),v);}}
  const st=bar*16+s;
  [['a','leadV','leadVol','leadOpt'],['b','lead2V','lead2Vol','lead2Opt']].forEach(([w,vk,vv,vo])=>{const e=leads[key][w][st];if(e&&e[0]!=null&&(w==='a'||S.lead2Min==null||inten>=S.lead2Min))V[S[vk]||song[vk]||(w==='a'?'lead':'pluck')](t,e[0]+(S[w==='a'?'leadOct':'lead2Oct']||0),e[1]*sd*.95,(S[vv]??song[vv]??.1)*L,S[vo]||song[vo]||{});});
  const A=S.arp;if(A&&gate({min:A.min||0,max:A.max,p:1})&&s%(A.rate||2)===0){const i=Math.floor(st/(A.rate||2)),pi=A.pat[i%A.pat.length],nn=ch.slice(A.from||1);const m=nn[pi%nn.length]+12*Math.floor(pi/nn.length)+(A.oct||0);V[A.v||'bell'](t,m,(A.rate||2)*sd*(A.gl||.9),(A.vol||.05)*L,A.opt||{});}
  pos.s++;if(pos.s===16){pos.s=0;pos.bar++;if(pos.bar>=S._ch.length*(S.reps||1)){pos.bar=0;pos.o++;if(pos.o>=song.order.length)pos.o=song.loopTo||0;}}
 }
 const sdur=()=>60/(song.bpm+((song.bpmMax||song.bpm)-song.bpm)*inten)/4;
 function tick(){if(!run)return;const ahead=ac.currentTime+.14;while(nextT<ahead){const sd=sdur();stepAt(nextT,sd);nextT+=sd;}}
 const API={
  init(ctx){if(!ac)build(ctx||new(window.AudioContext||window.webkitAudioContext)());return ac;},
  get ctx(){return ac;},
  get sfxBus(){return sfx;},
  play(sg){if(!ac)return;if(ac.state==='suspended')ac.resume();if(run&&song===sg)return;API.stop(true);song=sg;prep();pos={o:0,bar:0,s:0};nextT=ac.currentTime+.08;run=true;tick();timer=setInterval(tick,25);},
  stop(quick){run=false;clearInterval(timer);timer=0;},
  get playing(){return run;},
  section(){return song&&pos?song.order[pos.o]:null;},
  setIntensity(x){inten=Math.max(0,Math.min(1,x));},
  setMusic(v){if(!ac)return;mus.gain.cancelScheduledValues(ac.currentTime);mus.gain.setTargetAtTime(v,ac.currentTime,.08);},
  setSfx(v){if(!ac)return;sfx.gain.cancelScheduledValues(ac.currentTime);sfx.gain.setTargetAtTime(v,ac.currentTime,.03);},
  // efectos: tono con barrido y ruido filtrado, al bus de efectos
  tone(f,dur,type,v,f2,delay){if(!ac)return;const t=ac.currentTime+(delay||0);const o=osc(type||'sine',f,t,t+dur);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);const g=ac.createGain();env(g,t,.006,v,t+dur);o.connect(g);g.connect(sfx);},

/* Botón de sonido con panel (música / efectos, con volumen). Preferencias en localStorage. */
function JetAudioUI(o){
 const K=o.key,def={m:1,mv:.7,s:1,sv:.8};let P=Object.assign({},def,o.initial||{});
 try{Object.assign(P,JSON.parse(localStorage.getItem(K)||'{}'));}catch(e){}

 let tx=Object.assign({},TXD,o.tx||{});
 const uid='ja'+Math.random().toString(36).slice(2,7);
 const wrap=document.createElement('div');wrap.className='ja';
 wrap.innerHTML=`<button type="button" class="ja-b ${o.btnClass||''}" ${o.btnId?'id="'+o.btnId+'"':''} aria-label="${tx.label}" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h3l4-3.5v11L6 12H3z" fill="currentColor" stroke="none"/><g class="ja-on"><path d="M13 7.5a3.5 3.5 0 0 1 0 5"/><path d="M15.5 5a7 7 0 0 1 0 10"/></g><g class="ja-off"><path d="M13.5 7.5l5 5M18.5 7.5l-5 5"/></g></svg></button>
 <div class="ja-p" role="dialog" aria-label="${tx.label}">
  <div class="ja-r"><input type="checkbox" id="${uid}-m" data-k="m"><label for="${uid}-m" class="ja-tm">${tx.music}</label><input type="range" min="0" max="1" step="0.05" data-v="mv" aria-label="${tx.musicVol}"><output class="ja-o" data-o="mv" aria-hidden="true"></output></div>
  <div class="ja-r"><input type="checkbox" id="${uid}-s" data-k="s"><label for="${uid}-s" class="ja-ts">${tx.sfx}</label><input type="range" min="0" max="1" step="0.05" data-v="sv" aria-label="${tx.sfxVol}"><output class="ja-o" data-o="sv" aria-hidden="true"></output></div>
  <button type="button" class="ja-mute">${tx.mute}</button>
 </div>`;
 if(o.before)o.before.parentNode.insertBefore(wrap,o.before);else (o.parent||document.body).appendChild(wrap);
 const btn=wrap.querySelector('.ja-b'),pop=wrap.querySelector('.ja-p'),muteBtn=wrap.querySelector('.ja-mute');
 let started=false;
 const pct=v=>Math.round(v*100)+'%';
 const apply=()=>{const on=!!(P.m||P.s);wrap.classList.toggle('mute',!on);btn.classList.toggle('on',on);btn.setAttribute('aria-label',on?tx.on:tx.off);muteBtn.disabled=!on;
  wrap.querySelectorAll('[data-k]').forEach(i=>i.checked=!!P[i.dataset.k]);
  wrap.querySelectorAll('[data-v]').forEach(i=>{i.value=P[i.dataset.v];i.disabled=!P[i.dataset.v[0]];i.setAttribute('aria-valuetext',pct(P[i.dataset.v]));});
  wrap.querySelectorAll('[data-o]').forEach(x=>x.textContent=pct(P[x.dataset.o]));
  if(!JetSong.ctx)return;JetSong.setMusic(P.m?P.mv*(o.mlv||1):0);JetSong.setSfx(P.s?P.sv:0);

 /* Abrir/cerrar: clase y aria-expanded cambian juntos; al abrir por teclado el foco entra al panel; Escape devuelve el foco al botón (RSP-AUDIO-01) */
 const isOpen=()=>wrap.classList.contains('open');
 function setAudioOpen(open,opt){opt=opt||{};wrap.classList.toggle('open',open);btn.setAttribute('aria-expanded',String(open));
  if(open){pop.style.left='';pop.style.right='';const r=pop.getBoundingClientRect();if(r.left<6){pop.style.right='auto';pop.style.left=(6-wrap.getBoundingClientRect().left)+'px';}else if(r.right>innerWidth-6){pop.style.left='auto';pop.style.right=(wrap.getBoundingClientRect().right-innerWidth+6)+'px';}
   if(opt.focusFirst){const f=pop.querySelector('input:not(:disabled),button');if(f)f.focus();}}
  else if(opt.restoreFocus)btn.focus();}
 let viaPointer=false;
 btn.addEventListener('pointerdown',()=>{viaPointer=true;});
 btn.addEventListener('click',e=>{e.stopPropagation();start();const op=!isOpen();setAudioOpen(op,{focusFirst:op&&!viaPointer});viaPointer=false;});
 wrap.addEventListener('pointerdown',e=>e.stopPropagation());wrap.addEventListener('click',e=>e.stopPropagation());

 apply();

}

function puff(i,d){const[x,y]=cellXY(i);const[dx,dy]=DCH[d];for(let k=0;k<4;k++){parts.push({x:x+.5-dx*.4+(Math.random()-.5)*.5*(dy?1:0),y:y+.5-dy*.4+(Math.random()-.5)*.5*(dx?1:0)+.3*(dy?0:1),vx:(Math.random()-.5)*.5-dx*.3,vy:(Math.random()-.5)*.5-dy*.3-.2,life:.8,dec:2.4,col:'rgba(180,170,220,.6)',sz:.05+Math.random()*.04,dust:1});}}

let lastTs=0;
function frame(ts){
 requestAnimationFrame(frame);
 const dt=Math.min(.05,Math.max(0,(ts-lastTs)/1000));lastTs=ts;
 if(!L||!CW)return;
 const now=performance.now();pump(now);
 const moving=!!(anim&&(anim.k==='m'||anim.k==='u')&&anim.pFrom!==anim.pTo);
 if(moving)walkPh+=dt*(anim.dur<100?17:13);else walkPh*=.8;
 const pushing=anim&&anim.k==='m'&&anim.bi>=0;pushPose+=((pushing||(queue.length&&lastBi>=0&&anim&&anim.bi>=0))?1:0-pushPose)*Math.min(1,dt*(pushing?18:7));if(!pushing)pushPose=Math.max(0,pushPose-dt*5);
 for(let i=0;i<boxes.length;i++){const movingBox=anim&&anim.bi===i;const tg=(!movingBox&&L.goal[boxes[i]])?1:0;dock[i]=(dock[i]||0)+(tg-(dock[i]||0))*Math.min(1,dt*9);}
 for(const q of parts){q.life-=dt*q.dec;if(!q.ring){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vx*=.93;q.vy*=.93;}}parts=parts.filter(q=>q.life>0);
 draw(now/1000,now);
}
function pump(now){
 now=now||performance.now();
 if(anim&&now-anim.t0>=anim.dur){const a=anim,end=a.t0+a.dur;anim=null;endAnim(a);
  if(!anim&&queue.length&&!won&&!overlay()){stepQueue();if(anim&&anim.k==='m'&&now-end<40)anim.t0=end;}}
 if(!anim&&queue.length&&!won&&!overlay())stepQueue();
}
function ease(k){return k<0?0:k>1?1:1-(1-k)*(1-k);}
function draw(tm,now){
 const c=ctx,S=TS;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,CW,CH);
 const ik=Math.min(1,(now-introT)/420);c.save();if(ik<1){const e=1-Math.pow(1-ik,3),s=.93+.07*e;c.translate(CW/2,CH/2);c.scale(s,s);c.translate(-CW/2,-CH/2);c.globalAlpha=e;}
 c.drawImage(sc,0,0,CW,CH);
 for(const g of L.goals)drawPad(c,g,tm);
 // Nivel 1, antes del primer movimiento: flechas que fluyen del contenedor a la plataforma (la meta se entiende sin leer).
 if(li===0&&moves===0&&!won&&boxes.length===1){const[bx,by]=cellXY(boxes[0]),[gx,gy]=cellXY(L.goals[0]);
  if(by===gy&&gx>bx+1){const h=S*.15;for(let x=bx+1;x<gx;x++){const a=.18+.6*Math.max(0,Math.sin(tm*5-x*1.2));c.fillStyle='rgba(0,242,207,'+a.toFixed(3)+')';const cx=(x+.5)*S,cy=(by+.5)*S;c.beginPath();c.moveTo(cx-h*.55,cy-h);c.lineTo(cx+h*.65,cy);c.lineTo(cx-h*.55,cy+h);c.lineTo(cx-h*.1,cy);c.closePath();c.fill();}}}
 if(marker){const age=(now-marker.t)/450;if(age>1)marker=null;else{const[x,y]=cellXY(marker.c);c.strokeStyle=marker.bad?'rgba(255,110,120,'+(1-age)+')':'rgba(0,242,207,'+(1-age)*.8+')';c.lineWidth=Math.max(1.5,S*.04);rr(c,x*S+S*(.1-.06*age),y*S+S*(.1-.06*age),S*(.8+.12*age),S*(.8+.12*age),S*.18);c.stroke();}}
 // positions
 let k=anim?ease((now-anim.t0)/anim.dur):1;if(anim&&anim.k==='m'&&queue.length)k=Math.min(1,(now-anim.t0)/anim.dur);
 const pos=i=>[(i%L.W)+.5,((i/L.W)|0)+.5];
 let [px,py]=pos(p);
 if(anim&&(anim.k==='m'||anim.k==='u')){const[a,b]=pos(anim.pFrom);px=a+(px-a)*k;py=b+(py-b)*k;}
 if(anim&&anim.k==='b'){const q=(now-anim.t0)/anim.dur,o=Math.sin(Math.PI*Math.min(1,q))*.1;px+=DCH[anim.d][0]*o;py+=DCH[anim.d][1]*o;}
 const items=[];
 boxes.forEach((b,i)=>{let[x,y]=pos(b);const movingBox=!!(anim&&anim.bi===i&&(anim.k==='m'||anim.k==='u'));if(movingBox){const[a,bb]=pos(anim.bFrom);x=a+(x-a)*k;y=bb+(y-bb)*k;}
  const docked=!movingBox&&!!L.goal[b];items.push({y,draw:()=>drawCrate(c,x*S,y*S,dock[i]||0,tm,i,docked,now)});});
 const hop=won?(now-winT)/1000:0;
 items.push({y:py+.01,draw:()=>drawAstro(c,px*S,py*S-S*.04,won&&hop>.2&&hop<1.9?'d':facing,walkPh,!!(anim&&anim.k!=='b'&&anim.pFrom!==anim.pTo),pushPose,tm,won?hop:0)});
 items.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());
 for(const q of parts){c.globalAlpha=Math.max(0,q.life);if(q.ring){const r=(1-q.life)*S*.75+S*.3;c.strokeStyle='#00f2cf';c.lineWidth=Math.max(1,S*.05*q.life);c.beginPath();c.arc(q.x*S,q.y*S,r,0,7);c.stroke();}else{c.fillStyle=q.col;c.beginPath();c.arc(q.x*S,q.y*S,q.sz*S*(q.dust?1.5-q.life*.5:1),0,7);c.fill();}}
 c.restore();c.globalAlpha=1;
}

 LEVELS.forEach((lv,i)=>{const b=document.createElement('button');b.type='button';const best=prog.best[i];const lock=i>=prog.u;const st=best!=null?starsFor(best,lv.par):0;tot+=st;

  b.setAttribute('aria-label',lab);b.title=lab;if(lock)b.setAttribute('aria-disabled','true');
  if(lock){b.insertAdjacentHTML('beforeend','<svg class="lk" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.5 7V5a3.5 3.5 0 0 1 7 0v2h.5a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1zm1.6 0h3.8V5a1.9 1.9 0 0 0-3.8 0z"/></svg>');}
  else{const s=document.createElement('span');s.className='st';s.innerHTML=[0,1,2].map(k=>'<i class="'+(k<st?'on':'')+'">★</i>').join('');b.appendChild(s);}

// Miniaturas a 6 px por celda con la misma paleta que la partida: formas planas, alineadas al píxel, sin brillos (VIS-BOX-04)
function thumb(cvs,rows){const P=parseLevel(rows);const s=6;cvs.width=P.W*s;cvs.height=P.H*s;const c=cvs.getContext('2d');
 for(let i=0;i<P.N;i++){const x=(i%P.W)*s,y=((i/P.W)|0)*s;if(P.dw[i]){c.fillStyle=PAL.wall;c.fillRect(x,y,s,s);}else if(P.inside[i]){c.fillStyle=PAL.floor;c.fillRect(x,y,s,s);}
  if(P.goal[i]){c.strokeStyle=PAL.goal;c.lineWidth=1;c.strokeRect(x+1.5,y+1.5,s-3,s-3);}
  if(P.boxes.indexOf(i)>=0){c.fillStyle=PAL.crate;c.fillRect(x+1,y+1,s-2,s-2);c.fillStyle=P.goal[i]?PAL.coreOn:PAL.core;c.fillRect(x+2,y+2,s-4,s-4);}
  if(i===P.p){c.fillStyle=PAL.playerEdge;c.fillRect(x+1,y+1,s-2,s-2);c.fillStyle=PAL.player;c.fillRect(x+2,y+2,s-4,s-4);}}}

// board pointer: swipe / hold / tap
const stage=$('stage');let sp=null;

  sp.moved=true;sp.x=e.clientX;sp.y=e.clientY;marker=null;
  if(!sp.dir||queue.length<1)enqueue(d,1);
  sp.dir=d;clearTimeout(sp.hold);clearInterval(sp.rep);
  sp.hold=setTimeout(()=>{if(!sp)return;sp.rep=setInterval(()=>{if(sp&&sp.dir&&queue.length===0)enqueue(sp.dir,1);},60);},260);}
});
function endPointer(e,cancel){
 if(!sp||e.pointerId!==sp.id)return;clearTimeout(sp.hold);clearInterval(sp.rep);
 const s=sp;sp=null;
 if(!cancel&&!s.moved&&performance.now()-s.t<600){const r=cv.getBoundingClientRect();tapCell(Math.floor((e.clientX-r.left)/TS),Math.floor((e.clientY-r.top)/TS));}
}
stage.addEventListener('pointerup',e=>endPointer(e,false));

document.querySelectorAll('.dp').forEach(b=>{let pid=null,hold=0,rep=0,ptr=0;const d=b.dataset.d;
 const stop=()=>{pid=null;clearTimeout(hold);clearInterval(rep);b.classList.remove('act');};
 b.addEventListener('pointerdown',e=>{e.preventDefault();if(e.pointerType==='touch')setTouch(true);if(pid!==null)return;pid=e.pointerId;ptr=performance.now();try{b.setPointerCapture(pid);}catch(_){}b.classList.add('act');
  moveOnce(d);hold=setTimeout(()=>{rep=setInterval(()=>{if(queue.length===0)enqueue(d,1);},40);},280);});
 b.addEventListener('pointerup',e=>{if(e.pointerId===pid)stop();});
 b.addEventListener('pointercancel',e=>{if(e.pointerId===pid){stop();ptr=0;}});
 b.addEventListener('lostpointercapture',e=>{if(e.pointerId===pid){stop();ptr=0;}});
 b.addEventListener('click',e=>{if(ptr&&performance.now()-ptr<700){ptr=0;return;}ptr=0;moveOnce(d);});   // activación sintetizada: una casilla, nunca dos
 b.addEventListener('contextmenu',e=>e.preventDefault());
});
document.addEventListener('contextmenu',e=>{if(e.target.closest('#stage,#dpad,#ctrl'))e.preventDefault();});
window.addEventListener('resize',requestLayout);
window.addEventListener('orientationchange',()=>{requestLayout();setTimeout(requestLayout,250);});
if(window.visualViewport)visualViewport.addEventListener('resize',requestLayout);
document.addEventListener('visibilitychange',()=>{if(document.hidden){queue.length=0;}});

/* ---------- boot ---------- */
document.body.classList.toggle('touch',isTouch);
paintSound();applyLang();
const cur=store.get('cur',null);
let startL=0,startP='';if(cur&&typeof cur.l==='number'&&cur.l>=0&&cur.l<LEVELS.length&&cur.l<prog.u){startL=cur.l;startP=typeof cur.p==='string'?cur.p:'';}
else startL=Math.min(LEVELS.length-1,Math.max(0,prog.u-1));
document.querySelectorAll('.modal-bg').forEach(m=>{m.inert=true;});
layout();loadLevel(startL,startP);
requestAnimationFrame(frame);setInterval(()=>{if(L&&!document.hidden)pump();},40);
if(!store.get('seenHelp',false))setTimeout(()=>{$('hBody').innerHTML=helpHTML();openM('mHelp');},250);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js',{scope:'./'}).catch(()=>{});});}
window.__jetbox={get state(){return{li,p,boxes:boxes.slice(),moves,pushes,won,path,u:prog.u,anim:!!anim,queue:queue.length};},load:loadLevel,levels:LEVELS};
})();
</script>
