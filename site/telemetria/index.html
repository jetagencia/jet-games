<script>
/* SRC-G05 — estados de carga (loading / error / ready) antes del JS del juego. Autónomo a propósito:
   tiene que funcionar aunque falle src/textos.js, por eso lleva sus cadenas ES/EN acá. */
(function () {
  var L = (document.documentElement.lang === 'en') ? 'en' : 'es';
  var T = {
    es: { cargando: 'Cargando Telemetría…', inter: 'La carga se interrumpió. Podés volver a intentarlo.', red: 'No pudimos descargar todos los recursos.', recargar: 'Volver a cargar', juegos: 'Volver a los juegos' },
    en: { cargando: 'Loading Telemetry…', inter: 'Loading was interrupted. You can try again.', red: 'We couldn’t download all resources.', recargar: 'Reload game', juegos: 'Back to games' }
  }[L];
  var estado = 'cargando', timer = 0;
  function pintar() {
    var c = document.getElementById('cargaTxt'); if (!c) return;
    document.documentElement.setAttribute('data-carga', estado);
    if (estado === 'cargando') { c.innerHTML = '<p class="carga-txt">' + T.cargando + '</p>'; return; }
    if (estado === 'listo') return;
    c.innerHTML = '<p class="carga-txt" role="alert">' + (estado === 'red' ? T.red : T.inter) + '</p>' +
      '<div class="carga-acc"><button type="button" class="btn pri" id="cargaReintentar">' + T.recargar + '</button>' +
      '<a class="btn" href="https://jetgames.fun/?lang=' + L + '" target="_top" rel="noopener">' + T.juegos + '</a></div>';
    var b = document.getElementById('cargaReintentar');
    if (b) { b.addEventListener('click', function () { location.reload(); }); b.focus(); }
  }
  window.JETCarga = {
    error: function (tipo) { if (estado !== 'cargando') return; clearTimeout(timer); estado = tipo === 'red' ? 'red' : 'error'; pintar(); },
    listo: function () { clearTimeout(timer); estado = 'listo'; pintar(); window.removeEventListener('error', alError, true); }
  };
  function alError(e) {
    if (estado !== 'cargando') return;
    var tg = e && e.target;
    if (tg && tg.tagName === 'SCRIPT') { window.JETCarga.error('red'); return; }
    if (!tg || tg === window) window.JETCarga.error('error');
  }
  window.addEventListener('error', alError, true);
  timer = setTimeout(function () { if (estado === 'cargando') window.JETCarga.error('error'); }, 15000);
  document.addEventListener('DOMContentLoaded', pintar);
})();
</script>
