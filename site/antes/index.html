<script>
/* SRC-G05 · estado de carga antes del módulo del juego: título visible, error recuperable, sin spinner infinito. */
(function () {
  var es = (document.documentElement.lang || 'es') !== 'en';
  var T = es ? { load: 'Cargando JET//Antes…', err: 'La carga se interrumpió. Podés volver a intentarlo.', net: 'No pudimos descargar todos los recursos.', retry: 'Volver a cargar', back: 'Volver a los juegos' }
             : { load: 'Loading JET//Antes…', err: 'Loading was interrupted. You can try again.', net: 'We couldn’t download all resources.', retry: 'Reload game', back: 'Back to games' };
  var listo = false, fallo = false;
  function el(id) { return document.getElementById(id); }
  function pintar() { var c = el('carga'); if (!c) return; el('cargaTxt').textContent = fallo ? (fallo === 'net' ? T.net : T.err) : T.load; el('cargaAcc').hidden = !fallo; el('cargaSpin').hidden = !!fallo; el('cargaRetry').textContent = T.retry; el('cargaBack').textContent = T.back; c.setAttribute('aria-busy', fallo ? 'false' : 'true'); }
  window.__antesCarga = {
    listo: function () { listo = true; var c = el('carga'); if (c) { c.hidden = true; } clearTimeout(window.__antesCarga.t); },
    error: function (tipo) { if (listo) return; fallo = tipo || 'err'; pintar(); },
    t: setTimeout(function () { if (!listo) { fallo = 'err'; pintar(); } }, 20000)
  };
  window.addEventListener('error', function (e) { if (listo) return; var src = e && e.target && e.target.tagName === 'SCRIPT'; window.__antesCarga.error(src ? 'net' : 'err'); }, true);
  window.addEventListener('unhandledrejection', function () { if (!listo) window.__antesCarga.error('err'); });
  document.addEventListener('DOMContentLoaded', function () { pintar(); el('cargaRetry').addEventListener('click', function () { location.reload(); }); });
})();
</script>

  <div class="racha"><div><b id="diaRacha">0</b><span data-t="daily.streak"></span></div><div><b id="diaMejor">0</b><span data-t="daily.best"></span></div></div>
  <div id="diaRes"></div>
  <div id="diaCarga" style="display:none"><div class="spinner"></div><p class="note" style="text-align:center" data-t="daily.preparing"></p></div>
  <button class="btn pri" id="diaJugar" data-t="btn.playDaily"></button>
  <button class="btn" id="diaCompartir" data-t="btn.share" style="display:none"></button>
</div></div>

<!-- FIN DE CAPÍTULO -->
<div class="ov" id="finCap" role="dialog" aria-modal="true" aria-labelledby="fcTit"><div class="card">
  <div class="kick" id="fcKick" style="text-align:left"></div>
  <h2 class="res-t" id="fcTit" style="text-align:left;margin:4px 0 10px"></h2>
  <div class="log" id="fcLog"></div>
  <div class="meta" id="fcMeta"><span data-t="end.stars"></span><span class="v" id="fcStars"></span></div>
  <div class="compuerta" id="fcPuerta"><span id="fcNext"></span><i></i><em></em></div>
  <button class="btn pri" id="fcSeguir" data-t="btn.next"></button>
  <button class="btn" id="fcCaps" data-t="btn.chapters"></button>
</div></div>

<!-- FINAL -->
<div class="ov" id="final" role="dialog" aria-modal="true" aria-labelledby="finalTit">
  <canvas id="finalCv" style="position:absolute;inset:0;width:100%;height:100%" aria-hidden="true"></canvas>
  <div class="cred" id="finalCred">
    <div class="kick" data-t="final.thanks"></div>
    <h1 class="logo" id="finalTit">JET<i>//</i>Antes</h1>
    <p class="tag" id="finalLog"></p>
    <p class="note" data-t="final.credits"></p>
    <button class="btn pri" id="finalDiario" data-t="btn.daily"></button>
    <button class="btn" id="finalMenu" data-t="btn.menu"></button>
  </div>
</div>

<script type="module" src="src/main.js?v=6" onerror="window.__antesCarga&&window.__antesCarga.error('net')"></script>
</body>
</html>
