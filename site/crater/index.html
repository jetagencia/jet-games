<script>
(function () {
  var en = !!(window.JETIdioma && JETIdioma.get() === 'en');
  if (en) { document.title = 'JET//Crater · Sync with the world'; document.querySelector('#sCarga span').textContent = 'Crater'; }
  var T = en ? { c: 'Loading JET//Crater…', e: 'Loading was interrupted. You can try again.', n: 'We couldn’t download all resources.', r: 'Reload game', v: 'Back to games' }
             : { c: 'Cargando JET//Cráter…', e: 'La carga se interrumpió. Puedes volver a intentarlo.', n: 'No pudimos descargar todos los recursos.', r: 'Volver a cargar', v: 'Volver a los juegos' };
  var m = document.getElementById('cargaMsg'), a = document.getElementById('cargaAcc'), b = document.getElementById('cargaReint'), v = document.getElementById('cargaVolver');
  m.textContent = T.c; b.textContent = T.r; v.textContent = T.v; v.href = 'https://jetgames.fun/?lang=' + (en ? 'en' : 'es');
  var listo = false, fallo = false;
  function error(red) { if (listo || fallo) return; fallo = true; m.textContent = red ? T.n : T.e; a.hidden = false; document.getElementById('sCarga').classList.add('err'); b.focus(); }
  b.onclick = function () { location.reload(); };
  window.addEventListener('error', function (e) { if (listo) return; var t = e && e.target; if (t && t !== window && t.tagName !== 'SCRIPT') return; error(!!(t && t.tagName === 'SCRIPT')); }, true);
  var tm = setTimeout(function () { error(false); }, 12000);
  window.__crCargaLista = function () { listo = true; clearTimeout(tm); };
})();
</script>
