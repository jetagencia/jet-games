<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="rocketT"><title id="rocketT">JET//Rocket: la nave gira sobre su propia cola de cristales hacia un cristal nuevo</title>
  <defs>
    <radialGradient id="cr-sky" cx="0.55" cy="0.45" r="0.75"><stop offset="0" stop-color="#1a0a3a"/><stop offset="1" stop-color="#05030f"/></radialGradient>
    <linearGradient id="cr-body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7df0ff"/><stop offset="1" stop-color="#00f2cf"/></linearGradient>
    <radialGradient id="cr-crystal" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#00f2cf"/><stop offset="1" stop-color="#0e8aa0"/></radialGradient>
    <radialGradient id="cr-core" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffd4ec"/><stop offset="0.6" stop-color="#ff2bd6"/><stop offset="1" stop-color="#7a0a4a"/></radialGradient>
    <filter id="cr-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="180" fill="url(#cr-sky)"/>
  <g fill="#fff"><circle cx="30" cy="26" r=".9" opacity=".6"/><circle cx="96" cy="16" r=".6" opacity=".45"/><circle cx="150" cy="34" r=".7" opacity=".5"/><circle cx="276" cy="30" r=".7" opacity=".5"/><circle cx="48" cy="150" r=".7" opacity=".45"/><circle cx="296" cy="124" r=".6" opacity=".45"/><circle cx="210" cy="160" r=".6" opacity=".4"/></g>
  <!-- asteroide secundario -->
  <g transform="translate(62 136) rotate(-15)"><polygon points="-12,-4 -6,-12 6,-10 12,-2 10,8 2,12 -8,10 -14,2" fill="#5a4a3a" stroke="#2a1a0a" stroke-width="1"/><circle cx="-4" cy="-2" r="2" fill="#3a2a1a"/><circle cx="4" cy="4" r="1.5" fill="#3a2a1a"/></g>
  <!-- núcleo magenta, secundario -->
  <circle cx="246" cy="138" r="6" fill="url(#cr-core)" filter="url(#cr-glow)"/>
  <!-- cola: ocho segmentos en C, de atrás hacia adelante -->
  <g fill="#00f2cf">
    <circle cx="92" cy="118" r="4.2" opacity=".30"/>
    <circle cx="106" cy="126" r="4.6" opacity=".38"/>
    <circle cx="122" cy="130" r="5" opacity=".46"/>
    <circle cx="139" cy="127" r="5.4" opacity=".55"/>
    <circle cx="153" cy="117" r="5.8" opacity=".65"/>
    <circle cx="160" cy="104" r="6.2" opacity=".75"/>
    <circle cx="163" cy="91" r="6.6" opacity=".86"/>
    <circle cx="170" cy="80" r="7" opacity=".95"/>
  </g>
  <!-- cabeza: chevron girando hacia el cristal -->
  <g transform="translate(187 76) rotate(-18)">
    <ellipse cx="-10" cy="0" rx="6" ry="3" fill="#ff8000" opacity=".65"/>
    <path d="M -9 -7 L 12 0 L -9 7 L -4.5 0 Z" fill="url(#cr-body)" stroke="#0a0512" stroke-width="1.4"/>
    <circle cx="3" cy="0" r="1.8" fill="#fff"/>
  </g>
  <!-- cristal objetivo adelante, casi blanco -->
  <polygon points="246,58 255,48 264,58 255,72" fill="url(#cr-crystal)" filter="url(#cr-glow)"/>
</svg>
