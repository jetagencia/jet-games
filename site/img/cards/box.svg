<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="boxT"><title id="boxT">JET//Box: el astronauta empuja un contenedor hacia una plataforma libre; otro contenedor ya está en su sitio</title>
  <defs>
    <linearGradient id="cx-wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#54459a"/><stop offset="1" stop-color="#3a2f74"/></linearGradient>
    <pattern id="cx-bricks" width="40" height="20" patternUnits="userSpaceOnUse"><rect width="40" height="20" fill="url(#cx-wall)"/><path d="M0 20 L20 0 M20 20 L40 0" stroke="rgba(255,255,255,.05)" stroke-width="1"/></pattern>
    <filter id="cx-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="180" fill="#120a24"/>
  <g stroke="rgba(0,242,207,0.06)" stroke-width="1"><path d="M60 0V180M110 0V180M160 0V180M210 0V180M260 0V180M0 72H320M0 122H320"/></g>
  <!-- muros arriba y abajo: delimitan el pasillo sin comerse el cuadro -->
  <rect x="0" y="34" width="320" height="22" fill="url(#cx-bricks)"/>
  <rect x="0" y="134" width="320" height="22" fill="url(#cx-bricks)"/>
  <path d="M0 56 H320 M0 134 H320" stroke="#00f2cf" stroke-opacity=".45" stroke-width="2"/>
  <!-- plataforma libre -->
  <g fill="none" stroke="#00f2cf" stroke-width="2.5"><circle cx="208" cy="97" r="14"/></g><circle cx="208" cy="97" r="3" fill="#00f2cf"/>
  <!-- plataforma ocupada con contenedor resuelto -->
  <g fill="none" stroke="#00f2cf" stroke-width="2.5" opacity=".6"><circle cx="262" cy="97" r="14"/></g>
  <g transform="translate(244 79)" filter="url(#cx-glow)"><rect width="36" height="36" rx="8" fill="#f1eeff"/><rect y="15" width="36" height="6" rx="2" fill="#00bfa8"/><circle cx="18" cy="18" r="8" fill="#1a0f36"/><circle cx="18" cy="18" r="6" fill="#5ffff0"/></g>
  <!-- contenedor que se empuja -->
  <g transform="translate(139 79)"><rect width="36" height="36" rx="8" fill="#f1eeff"/><rect y="15" width="36" height="6" rx="2" fill="#7700f4"/><circle cx="18" cy="18" r="8" fill="#1a0f36"/><circle cx="18" cy="18" r="6" fill="#fdd835"/></g>
  <!-- flecha de empuje sutil, sobre el suelo -->
  <path d="M179 97 H196" stroke="rgba(0,242,207,.5)" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- astronauta oficial, detrás del contenedor -->
  <g transform="translate(112 97) scale(1.25)">
    <ellipse cx="0" cy="17" rx="11" ry="3" fill="rgba(0,0,0,.4)"/>
    <path d="M-4 -19 L-6 -25 M4 -19 L6 -25" stroke="#8f97b8" stroke-width="1.6"/>
    <circle cx="-6" cy="-26" r="1.8" fill="#fdd835"/><circle cx="6" cy="-26" r="1.8" fill="#fdd835"/>
    <rect x="-8" y="-3" width="16" height="16" rx="5" fill="#eef1fa"/>
    <rect x="-8" y="8" width="16" height="2" fill="#7700f4"/>
    <rect x="6" y="-1" width="12" height="5" rx="2.5" fill="#eef1fa"/>
    <circle cx="0" cy="-10" r="10" fill="#f4f6fc"/>
    <ellipse cx="3" cy="-10" rx="6" ry="5.5" fill="#00c4d4"/>
    <ellipse cx="1" cy="-12" rx="2" ry="1.4" fill="#fff" opacity=".85"/>
  </g>
</svg>
