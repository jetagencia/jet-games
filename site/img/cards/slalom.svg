<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="slalomT"><title id="slalomT">JET//Slalom: el esquiador traza una curva para pasar entre las banderas de la próxima puerta</title>
  <defs>
    <linearGradient id="cs-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#112846"/><stop offset="1" stop-color="#1e3d5f"/></linearGradient>
    <linearGradient id="cs-trail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(255,255,255,0)"/><stop offset="1" stop-color="rgba(255,255,255,0.55)"/></linearGradient>
    <filter id="cs-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="320" height="180" fill="url(#cs-bg)"/>
  <!-- zonas frías más claras de la pista -->
  <path d="M0 110 Q 90 70 180 92 T 320 60 V180 H0 Z" fill="rgba(200,225,255,0.07)"/>
  <path d="M40 180 Q 120 120 230 128 T 320 110 V180 Z" fill="rgba(200,225,255,0.06)"/>
  <!-- pino real del juego, fuera de la línea -->
  <g fill="#0a3848" stroke="#1a5868" stroke-width="1" transform="translate(58 42) scale(1.6)"><path d="M 0 0 L 6 -16 L 12 0 Z"/><rect x="5" y="0" width="2" height="4" fill="#082030"/></g>
  <g fill="#0a3848" stroke="#1a5868" stroke-width="1" transform="translate(262 112) scale(1.3)"><path d="M 0 0 L 6 -14 L 12 0 Z"/><rect x="5" y="0" width="2" height="4" fill="#082030"/></g>
  <!-- puerta objetivo: magenta a la izquierda, cian a la derecha -->
  <line x1="192" y1="44" x2="192" y2="70" stroke="#ff2bd6" stroke-width="4" stroke-linecap="round" filter="url(#cs-glow)"/>
  <line x1="243" y1="44" x2="243" y2="70" stroke="#00f2cf" stroke-width="4" stroke-linecap="round" filter="url(#cs-glow)"/>
  <path d="M196 50 H239" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- huellas que vienen de abajo a la izquierda y curvan -->
  <path d="M 92 150 C 110 122, 128 112, 141 100" stroke="url(#cs-trail)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <path d="M 106 156 C 122 128, 138 118, 152 104" stroke="url(#cs-trail)" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  <!-- esquiador del juego, girando hacia la puerta -->
  <g transform="translate(147 97) rotate(28) scale(1.5)">
    <path d="M -10 0 L 0 -14 L 10 0 L 6 4 L -6 4 Z" fill="#00f2cf" stroke="#0a0512" stroke-width="1.5"/>
    <circle cx="0" cy="-8" r="2" fill="#fff"/>
  </g>
</svg>
