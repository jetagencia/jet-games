<script>
/* Mudanza desde jetwords.jetgames.fun (2026-10-22): el puente de la dirección vieja manda el progreso
   en #jet-migrar=<base64url de un JSON {clave:valor}>; se importan solo las claves que aún no existen. */
(function(){var m=location.hash.match(/^#jet-migrar=([A-Za-z0-9_-]+)/);if(!m)return;
try{var b=m[1].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';var d=JSON.parse(decodeURIComponent(escape(atob(b))));
for(var k in d){if(Object.prototype.hasOwnProperty.call(d,k)&&typeof d[k]==='string'&&localStorage.getItem(k)===null)localStorage.setItem(k,d[k]);}}catch(e){}
try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}})();
</script>

<style>
:root{--bg:#0a0512;--bg2:#120a22;--card:#1a1030;--line:rgba(245,240,255,.12);--ink:#f5f2ff;--dim:#9a90b8;--cyan:#00f2cf;--violet:#7700f4;--yellow:#fdd835;--green:#3ddc84;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:radial-gradient(120% 80% at 50% -10%,#241145 0%,var(--bg) 60%);background-color:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding:calc(6px + var(--sat)) calc(10px + var(--sar)) calc(6px + var(--sab)) calc(10px + var(--sal))}
header{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"back . tools" "brand modes modes";align-items:center;column-gap:10px;row-gap:6px;padding:4px 2px}

#back::before{content:'';position:absolute;inset:-2px 0}

#back:hover,#back:focus-visible{color:#fff;border-color:var(--cyan);outline:none}
.tools{grid-area:tools;display:flex;gap:6px;align-items:center}

.brand{font-weight:800;font-size:22px;letter-spacing:-.02em;white-space:nowrap}.brand .sl{color:var(--cyan)}
.spacer{flex:1}
.ib{width:42px;height:42px;position:relative;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--dim);flex:none}

.modes button{flex:1 1 auto;min-width:0;min-height:38px;padding:0 8px;border-radius:9px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.modes button.on{background:var(--violet);color:#fff}

.cell.filled{border-color:var(--dim)}.cell.pop{animation:pop .12s}
.cell.absent{background:#2a2140;border-color:#2a2140;color:#7d7396}.cell.present{background:var(--yellow);border-color:var(--yellow);color:#1a1200}.cell.correct{background:var(--green);border-color:var(--green);color:#052d18}
.cell.flip{animation:flip .5s ease-in-out}
.row.win .cell{animation:hop .5s ease both}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}

.key.wide{max-width:70px;flex:1.6;font-size:12px}
.key.absent{background:#17102a;color:#5a5275}.key.present{background:var(--yellow);color:#1a1200}.key.correct{background:var(--green);color:#052d18}

.toast.show{opacity:1}
.modal-bg{position:fixed;inset:0;background:rgba(5,2,12,.72);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal-bg.show{display:flex}
.modal{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:20px;width:min(440px,100%);max-height:calc(100dvh - 32px);overflow:auto;animation:rise .22s ease}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 6px;font-size:22px;padding-right:44px}.modal p{color:var(--dim);margin:6px 0;font-size:14px;line-height:1.5}
.x{position:absolute;top:10px;right:10px;width:44px;height:44px;border-radius:10px;color:var(--dim);font-size:20px;display:flex;align-items:center;justify-content:center}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}.stat b{display:block;font-size:22px;font-family:'JetBrains Mono',monospace}.stat span{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.btn{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-weight:700;text-align:center;white-space:nowrap}.btn.primary{background:var(--cyan);color:#052d18;border-color:transparent}

.ex{display:inline-flex;gap:4px;margin:4px 0}.ex span{width:30px;height:30px;border-radius:6px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;text-transform:uppercase}

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const HELP_ES='<p>Adivina la palabra de <b>cinco letras</b> en seis intentos. Después de cada intento los colores te guían:</p><div class="ex"><span class="c">p</span><span>l</span><span>a</span><span>t</span><span>o</span></div><p><b>Verde</b>: la letra está en la palabra y en ese lugar.</p><div class="ex"><span>c</span><span class="p">a</span><span>m</span><span>p</span><span>o</span></div><p><b>Amarillo</b>: la letra está, pero en otro lugar.</p><div class="ex"><span>n</span><span>u</span><span>b</span><span class="a">e</span><span>s</span></div><p><b>Gris</b>: la letra no está.</p><p>Las tildes no cuentan (escribe <b>arbol</b> para árbol) y la <b>ñ</b> es una letra más. Se aceptan plurales y verbos conjugados. Hay una palabra nueva cada día y práctica sin límite.</p><p>Teclado: escribe, <b>Enter</b> para enviar, <b>Retroceso</b> para borrar.</p><p style="font-size:11px">Diccionarios: Hunspell RLA-ES (MPL), Wiktionary vía Kaikki (CC BY-SA 4.0), ENABLE y SCOWL. Música original de JET.</p>';
const HELP_EN='<p>Guess the <b>five-letter</b> word in six tries. After each guess the colors guide you:</p><div class="ex"><span class="c">p</span><span>l</span><span>a</span><span>n</span><span>t</span></div><p><b>Green</b>: the letter is in the word and in the right spot.</p><div class="ex"><span>c</span><span class="p">a</span><span>m</span><span>p</span><span>s</span></div><p><b>Yellow</b>: the letter is in the word but elsewhere.</p><div class="ex"><span>b</span><span>o</span><span>a</span><span class="a">r</span><span>d</span></div><p><b>Gray</b>: the letter is not in the word.</p><p>A new word every day, plus unlimited practice. Keyboard: type, <b>Enter</b> to submit, <b>Backspace</b> to delete.</p><p style="font-size:11px">Word lists: ENABLE, SCOWL, Hunspell RLA-ES (MPL) and Wiktionary via Kaikki (CC BY-SA 4.0). Original music by JET.</p>';
const T={
 es:{sub:['Palabra del día · {d}','Práctica · sin límite'],modes:['Palabra del día','Práctica'],short:'Faltan letras',bad:'No está en la lista',win:['¡Genial!','¡Impresionante!','¡Excelente!','¡Muy bien!','¡Bien!','¡Por poco!'],lose:'La palabra era',stats:['Jugadas','Victorias','Racha','Mejor racha'],statsT:'Estadísticas',share:'Copiado al portapapeles',shareB:'Compartir',next:'Otra palabra',practice:'Práctica',close:'Cerrar',nextIn:'Próxima palabra en',help:HELP_ES,helpT:'Cómo jugar',helpOk:'A jugar',keys:['qwertyuiop','asdfghjklñ','⏎zxcvbnm⌫'],enter:'Enviar',del:'Borrar',set:'Ajustes',mus:'Música',musS:'Composición original, suave, para pensar',sfx:'Efectos',sfxS:'Teclas y fichas',ok:'Listo',tries:'{n} de 6 intentos',lang:'Idioma',langS:'También cambia la lista de palabras y se aplica a todo JET//Games.',back:'Volver a JET//Games',modeNav:'Modo',title:'JET//Words · La palabra del día',desc:'Adivina la palabra de cinco letras en seis intentos. Una palabra nueva cada día, en español y en inglés, y práctica sin límite.',langB:'Idioma'},
 en:{sub:['Word of the day · {d}','Practice · unlimited'],modes:['Word of the day','Practice'],short:'Not enough letters',bad:'Not in word list',win:['Genius!','Brilliant!','Impressive!','Very good!','Nice!','Just in time!'],lose:'The word was',stats:['Played','Wins','Streak','Best streak'],statsT:'Statistics',share:'Copied to clipboard',shareB:'Share',next:'Another word',practice:'Practice',close:'Close',nextIn:'Next word in',help:HELP_EN,helpT:'How to play',helpOk:'Play',keys:['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'],enter:'Enter',del:'Delete',set:'Settings',mus:'Music',musS:'Original score, calm, made for thinking',sfx:'Sound effects',sfxS:'Keys and tiles',ok:'Done',tries:'{n} of 6 tries',lang:'Language',langS:'Also switches the word list and applies across JET//Games.',back:'Back to JET//Games',modeNav:'Mode',title:'JET//Words · Word of the day',desc:'Guess the five-letter word in six tries. A new word every day, in English and Spanish, plus unlimited practice.',langB:'Language'}
};
const store={get(k,d){try{const v=localStorage.getItem('jetwords.'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('jetwords.'+k,JSON.stringify(v));}catch(e){}}};
// listas: el diccionario de intentos viene concatenado de a 5 letras
const DICT={};
function dict(l){if(!DICT[l]){const L=window.WORDS[l];const s=new Set(L.ok.match(/.{5}/gu));L.ans.forEach(w=>s.add(w));L.daily.forEach(w=>s.add(w));DICT[l]=s;}return DICT[l];}
const strip=s=>s.replace(/ñ/g,'\0').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\0/g,'ñ');
// Idioma: uno solo para todo jetgames.fun (JETIdioma, _shared/jet-idioma.js). La preferencia vieja
// jetwords.lang se migra una vez, solo si no hay una elección guardada para el sitio, y se borra.
(function(){try{let o=localStorage.getItem('jetwords.lang');if(o===null)return;localStorage.removeItem('jetwords.lang');o=JSON.parse(o);
  if(!/(?:^|;\s*)jet_lang=(es|en)\b/.test(document.cookie)&&(o==='es'||o==='en'))JETIdioma.set(o);}catch(e){}})();
let lang=JETIdioma.get()==='en'?'en':'es';
let mode=store.get('mode','daily');if(mode!=='daily'&&mode!=='free')mode='daily';
let answer='',rows=[],cur='',done=false,won=false,keyState={},busy=false;
// Índice del día: días de calendario desde el 01-01-2026 en la hora local. Hasta el día del cambio
// (22-10-2026) se conserva la cuenta anterior, que en horario de verano cambiaba a la 1:00.
function dayIndex(){const n=new Date();const cal=Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(2026,0,1))/864e5);const last=window.WORDS.es.legacyLast;if(cal<=last)return Math.min(cal,Math.floor((Date.now()-new Date(2026,0,1).getTime())/864e5));return cal;}
const dayLabel=()=>new Date().toLocaleDateString(lang==='en'?'en-GB':'es',{day:'numeric',month:'short'});
function pickAnswer(){const L=window.WORDS[lang];if(mode==='daily'){const o=L.daily,d=dayIndex();return o[((d%o.length)+o.length)%o.length];}let w;do{w=L.ans[Math.floor(Math.random()*L.ans.length)];}while(w===answer&&L.ans.length>1);return w;}
const shown=w=>(lang==='es'&&window.WORDS.es.disp[w])||w;
function stateKey(){return 'state.'+lang+'.'+(mode==='daily'?'d'+dayIndex():'free');}
let playingDay=null;
// La partida en curso se guarda por idioma y modo (jetwords.state.<lang>.d<día> | .free): cambiar de
// idioma o recargar nunca la pierde; al volver al idioma anterior sigue donde estaba.
// keep=false (botón «Otra palabra») empieza una práctica nueva; noEnd evita abrir el resultado encima de Ajustes.
function newGame(keep,noEnd){
  if(keep===undefined)keep=true;
  rows=[];cur='';done=false;won=false;keyState={};busy=false;playingDay=mode==='daily'?dayIndex():null;
  let s=null;
  if(mode==='daily'){answer=pickAnswer();s=store.get(stateKey(),null);if(s&&s.answer!==answer)s=null;}
  else{s=keep?store.get(stateKey(),null):null;if(!(s&&typeof s.answer==='string'&&window.WORDS[lang].ans.includes(s.answer)&&!s.done))s=null;answer=s?s.answer:pickAnswer();}
  if(s&&Array.isArray(s.rows)){rows=s.rows.filter(r=>typeof r==='string'&&r.length===5).slice(0,6);done=!!s.done;won=!!s.won;rows.forEach(r=>markKeys(r));
    if(!done&&typeof s.cur==='string'&&/^[a-zñ]{0,5}$/.test(s.cur))cur=s.cur;}
  saveState();renderAll();paintTexts();
  if(done&&!noEnd)setTimeout(()=>{if(!modalOpen())showEnd();},300);
}
function saveState(){store.set(stateKey(),{answer,rows,cur,done,won});}
function evalGuess(g){const res=Array(5).fill('absent'),left=answer.split('');for(let i=0;i<5;i++)if(g[i]===answer[i]){res[i]='correct';left[i]=null;}for(let i=0;i<5;i++){if(res[i]==='correct')continue;const j=left.indexOf(g[i]);if(j>=0){res[i]='present';left[j]=null;}}return res;}
const RANK={absent:1,present:2,correct:3};
function markKeys(g){const r=evalGuess(g);for(let i=0;i<5;i++){const k=g[i];if(!keyState[k]||RANK[r[i]]>RANK[keyState[k]])keyState[k]=r[i];}}
function renderAll(hideRow){
  const grid=$('grid');grid.innerHTML='';
  for(let r=0;r<6;r++){const row=document.createElement('div');row.className='row';row.id='row'+r;const g=rows[r]||(r===rows.length?cur:'');const res=rows[r]&&r!==hideRow?evalGuess(rows[r]):null;
    for(let i=0;i<5;i++){const c=document.createElement('div');c.className='cell'+(g[i]?' filled':'')+(res?' '+res[i]:'');c.textContent=g[i]||'';row.appendChild(c);}grid.appendChild(row);}
  renderKb();
}
function renderCur(){const row=$('row'+rows.length);if(!row)return;[...row.children].forEach((c,i)=>{const ch=cur[i]||'';if(c.textContent!==ch){c.textContent=ch;c.classList.toggle('filled',!!ch);c.classList.remove('pop');if(ch){void c.offsetWidth;c.classList.add('pop');}}});}
function renderKb(){const kb=$('kb');kb.innerHTML='';T[lang].keys.forEach(r=>{const row=document.createElement('div');row.className='krow';[...r].forEach(k=>{const b=document.createElement('button');const wide=k==='⏎'||k==='⌫';b.className='key'+(wide?' wide':'')+(keyState[k]?' '+keyState[k]:'');b.textContent=k==='⏎'?T[lang].enter:k;if(k==='⌫')b.setAttribute('aria-label',T[lang].del);b.dataset.k=k;b.tabIndex=-1;b.addEventListener('pointerdown',e=>{e.preventDefault();window.JWAudio&&JWAudio.unlock();press(k);});row.appendChild(b);});kb.appendChild(row);});}
let toastT=null;function toast(m,ms){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),ms||1400);}
const sfx=(n,a,b)=>{try{window.JWAudio&&JWAudio.sfx(n,a,b);}catch(e){}};
function press(k){
  if(done||busy)return;
  if(k==='⌫'){if(cur){cur=cur.slice(0,-1);renderCur();sfx('del');saveState();}return;}
  if(k==='⏎'){submit();return;}
  if(!/^[a-zñ]$/.test(k)||(lang==='en'&&k==='ñ'))return;
  if(cur.length<5){cur+=k;renderCur();sfx('key');saveState();}
}
function submit(){
  if(cur.length<5){toast(T[lang].short);shakeRow();sfx('bad');return;}
  if(!dict(lang).has(cur)){toast(T[lang].bad);shakeRow();sfx('bad');return;}
  const g=cur,ri=rows.length;rows.push(g);cur='';
  if(g===answer){done=true;won=true;}else if(rows.length>=6){done=true;won=false;}
  saveState();if(done)recordStats();
  busy=true;renderAll(ri);
  const res=evalGuess(g),cells=[...$('row'+ri).children],STEP=reduced?0:260;
  cells.forEach((c,i)=>{setTimeout(()=>{c.classList.add('flip');setTimeout(()=>{c.classList.add(res[i]);sfx('tile',res[i],i);},reduced?0:250);},i*STEP);});
  setTimeout(()=>{markKeys(g);busy=false;renderKb();
    // si pidieron otro idioma durante la animación, se aplica ahora (la partida ya quedó guardada)
    if(pendLang){const nl=pendLang;pendLang=null;applyLang(nl);return;}
    if(done){if(won){$('row'+ri).classList.add('win');sfx('win');}else{sfx('lose');toast(shown(answer).toUpperCase(),2200);}setTimeout(()=>showEnd(),won?900:1300);}
  },4*STEP+(reduced?0:520));
}
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function shakeRow(){const row=$('row'+rows.length);if(!row)return;row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');setTimeout(()=>row.classList.remove('shake'),450);}
// estadísticas por idioma y modo (mismas claves de siempre: jetwords.stats.<lang>.<mode>)
const EMPTY=()=>({played:0,wins:0,streak:0,best:0,dist:[0,0,0,0,0,0]});
function statsKey(){return 'stats.'+lang+'.'+mode;}
function getStats(){const s=Object.assign(EMPTY(),store.get(statsKey(),{}));if(!Array.isArray(s.dist)||s.dist.length!==6)s.dist=[0,0,0,0,0,0];return s;}
function recordStats(){const s=getStats();
  // la racha diaria se corta si quedó un día sin jugar
  if(mode==='daily'){const d=dayIndex();if(s.lastDay!=null&&d-s.lastDay>1)s.streak=0;s.lastDay=d;}
  s.played++;if(won){s.wins++;s.streak++;s.best=Math.max(s.best,s.streak);s.dist[rows.length-1]++;}else s.streak=0;store.set(statsKey(),s);}
function paintStats(hi){const s=getStats(),t=T[lang];
  if(mode==='daily'&&s.lastDay!=null&&dayIndex()-s.lastDay>1)s.streak=0;
  $('eStats').innerHTML=[s.played,s.played?Math.round(s.wins/s.played*100)+'%':'0%',s.streak,s.best].map((v,i)=>`<div class="stat"><b>${v}</b><span>${t.stats[i]}</span></div>`).join('');
  const mx=Math.max(1,...s.dist);$('eDist').innerHTML=s.dist.map((n,i)=>`<div><span>${i+1}</span><i class="${hi===i?'hi':''}" style="width:${Math.max(8,n/mx*100)}%">${n}</i></div>`).join('');}
function showEnd(){
  const t=T[lang];
  $('eTitle').textContent=won?t.win[Math.min(rows.length-1,5)]:t.lose;$('eWord').textContent=shown(answer);$('eMsg').textContent=won?t.tries.replace('{n}',rows.length):'';
  paintStats(won?rows.length-1:-1);$('eShare').style.display='';$('eShare').textContent=t.shareB;
  $('eNext').textContent=mode==='daily'?t.practice:t.next;$('eNext').dataset.act=mode==='daily'?'practice':'next';
  tickTimer();openModal('mEnd');
}
function tickTimer(){const el=$('eTimer');
  if(mode!=='daily'||!$('eWord').textContent){el.innerHTML='';return;}
  const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1),s=Math.max(0,Math.floor((m-n)/1000));
  const p=x=>String(x).padStart(2,'0');el.innerHTML=`<small>${T[lang].nextIn}</small>${p(Math.floor(s/3600))}:${p(Math.floor(s/60)%60)}:${p(s%60)}`;}
setInterval(()=>{if($('mEnd').classList.contains('show'))tickTimer();
  // pasó la medianoche con el juego abierto: palabra nueva
  if(mode==='daily'&&playingDay!=null&&dayIndex()!==playingDay&&!busy){closeAll();newGame();}},1000);
function shareText(){const sq={correct:'🟩',present:'🟨',absent:'⬛'};const g=rows.map(r=>evalGuess(r).map(x=>sq[x]).join('')).join('\n');return `JET//Words ${lang.toUpperCase()} ${mode==='daily'?'#'+dayIndex():'·'} ${won?rows.length:'X'}/6\n${g}\nhttps://jetgames.fun/words/`;}
$('eShare').onclick=async()=>{const txt=shareText();try{if(navigator.share&&matchMedia('(pointer:coarse)').matches){await navigator.share({text:txt});return;}}catch(e){if(e&&e.name==='AbortError')return;}try{await navigator.clipboard.writeText(txt);toast(T[lang].share);}catch(e){toast(txt.split('\n')[0]);}};
$('eNext').onclick=()=>{closeModal('mEnd');const a=$('eNext').dataset.act;if(a==='practice')setMode('free');else if(a==='next')newGame(false);};
// modales
function openModal(id){closeAll();clearTimeout(toastT);$('toast').classList.remove('show');$(id).classList.add('show');const f=$(id).querySelector('.btn.primary');if(f&&matchMedia('(pointer:fine)').matches)f.focus({preventScroll:true});}
function closeModal(id){$(id).classList.remove('show');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();}
function closeAll(){document.querySelectorAll('.modal-bg.show').forEach(m=>closeModal(m.id));}
const modalOpen=()=>!!document.querySelector('.modal-bg.show');
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModal(b.closest('.modal-bg').id)));
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);}));
$('btnHelp').onclick=()=>{$('hTitle').textContent=T[lang].helpT;$('hBody').innerHTML=T[lang].help;$('hOk').textContent=T[lang].helpOk;openModal('mHelp');sfx('ui');};
$('btnStats').onclick=()=>{const t=T[lang];$('eTitle').textContent=t.statsT;$('eWord').textContent='';$('eMsg').textContent='';paintStats(-1);$('eShare').style.display='none';$('eNext').textContent=t.close;$('eNext').dataset.act='close';$('eTimer').innerHTML='';openModal('mEnd');sfx('ui');};
// Selector ES | EN (cabecera y Ajustes): solo llama a JETIdioma.set; el cambio llega por el evento
// 'jet-idioma' y se aplica en vivo, sin recargar. En este juego el idioma también elige la lista de palabras.
$('btnLang').onclick=e=>{const t=e.target.closest('button');if(t)JETIdioma.set(t.dataset.l);};
$('sLang').onclick=e=>{const t=e.target.closest('button');if(t)JETIdioma.set(t.dataset.l);};
let pendLang=null;
function applyLang(nl){
  if((nl!=='es'&&nl!=='en')||nl===lang)return;
  if(busy){pendLang=nl;return;}
  saveState();lang=nl;
  if($('mEnd').classList.contains('show'))closeModal('mEnd'); // estadísticas del otro idioma: se cierran
  newGame(true,true);sfx('ui');
}
window.addEventListener('jet-idioma',e=>applyLang(e.detail));
function paintTexts(){const t=T[lang];document.documentElement.lang=lang;
  document.title=t.title;const md=document.querySelector('meta[name="description"]');if(md)md.content=t.desc;
  $('back').setAttribute('aria-label',t.back);$('modes').setAttribute('aria-label',t.modeNav);
  document.querySelectorAll('#btnLang button,#sLang button').forEach(x=>{const on=x.dataset.l===lang;x.classList.toggle('on',on);x.setAttribute('aria-pressed',on);});
  $('sLangL').firstChild.textContent=t.lang;$('sLangS').textContent=t.langS;$('btnLang').setAttribute('aria-label',t.langB);
  if($('mHelp').classList.contains('show')){$('hTitle').textContent=t.helpT;$('hBody').innerHTML=t.help;$('hOk').textContent=t.helpOk;}
  $('mDaily').textContent=t.modes[0];$('mFree').textContent=t.modes[1];$('mDaily').classList.toggle('on',mode==='daily');$('mFree').classList.toggle('on',mode==='free');
  $('sub').textContent=t.sub[mode==='daily'?0:1].replace('{d}',dayLabel());
  $('btnStats').setAttribute('aria-label',t.statsT);$('btnStats').title=t.statsT;$('btnHelp').setAttribute('aria-label',t.helpT);$('btnHelp').title=t.helpT;$('btnSet').setAttribute('aria-label',t.set);$('btnSet').title=t.set;
  $('sTitle').textContent=t.set;$('sMusL').firstChild.textContent=t.mus;$('sMusS').textContent=t.musS;$('sSfxL').firstChild.textContent=t.sfx;$('sSfxS').textContent=t.sfxS;$('sOk').textContent=t.ok;
  document.querySelectorAll('.x').forEach(x=>x.setAttribute('aria-label',t.close));}
function setMode(m){if(busy)return;mode=m;store.set('mode',m);newGame();}
$('mDaily').onclick=()=>{if(mode!=='daily'){setMode('daily');sfx('ui');}};$('mFree').onclick=()=>{if(mode!=='free'){setMode('free');sfx('ui');}else if(done)newGame(false);};
// ajustes de sonido (se recuerdan en jetwords.audio)
const audio=Object.assign({music:true,mv:55,sfx:true,sv:80},store.get('audio',{}));
function applyAudio(){const A=window.JWAudio;if(!A)return;A.setMusicVol(audio.mv/100);A.setSfxVol(audio.sv/100);A.setMusic(audio.music);A.setSfx(audio.sfx);}
function paintAudio(){$('sMus').setAttribute('aria-checked',audio.music);$('sSfx').setAttribute('aria-checked',audio.sfx);$('sMusV').value=audio.mv;$('sSfxV').value=audio.sv;$('sMusV').disabled=!audio.music;$('sSfxV').disabled=!audio.sfx;$('sMusV').style.setProperty('--v',audio.mv+'%');$('sSfxV').style.setProperty('--v',audio.sv+'%');}
$('btnSet').onclick=()=>{paintAudio();openModal('mSet');sfx('ui');};
$('sMus').onclick=()=>{audio.music=!audio.music;store.set('audio',audio);paintAudio();applyAudio();};
$('sSfx').onclick=()=>{audio.sfx=!audio.sfx;store.set('audio',audio);paintAudio();applyAudio();sfx('ui');};
$('sMusV').oninput=e=>{audio.mv=+e.target.value;paintAudio();applyAudio();};$('sMusV').onchange=()=>store.set('audio',audio);
$('sSfxV').oninput=e=>{audio.sv=+e.target.value;paintAudio();applyAudio();};$('sSfxV').onchange=()=>{store.set('audio',audio);sfx('tile','correct',2);};
// el audio arranca con el primer gesto (política de reproducción automática)
function firstGesture(){if(!window.JWAudio)return;applyAudio();JWAudio.unlock();applyAudio();}
['pointerdown','keydown','touchstart'].forEach(ev=>window.addEventListener(ev,firstGesture,{capture:true,passive:true}));
// teclado físico
window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'){if(modalOpen()){e.preventDefault();closeAll();}return;}
  if(modalOpen()){if(e.key==='Enter'&&$('mEnd').classList.contains('show')&&document.activeElement===document.body){e.preventDefault();$('eNext').click();}return;}
  const tgt=e.target;if(tgt&&tgt.tagName==='INPUT')return;
  let k=e.key;if(k==='Enter'){e.preventDefault();press('⏎');return;}if(k==='Backspace'){e.preventDefault();press('⌫');return;}
  if(!k||k.length!==1)return;k=strip(k.toLowerCase());if(e.key.toLowerCase()==='ñ')k='ñ';
  if(/^[a-zñ]$/.test(k)){e.preventDefault();press(k);const b=document.querySelector('.key[data-k="'+k+'"]');if(b){b.classList.add('down');setTimeout(()=>b.classList.remove('down'),110);}}
});
// los botones no se quedan con el foco (Enter enviaría el intento y además los activaría)
document.querySelectorAll('header button').forEach(b=>b.addEventListener('mouseup',()=>b.blur()));
newGame();
if(!store.get('seenHelp',false)){store.set('seenHelp',true);$('btnHelp').click();}
// caché sin conexión (sw.js con alcance relativo: /words/)
if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
window.JETWORDS={get answer(){return answer;},get rows(){return rows.slice();},get done(){return done;},get busy(){return busy;},dayIndex,press,dict:()=>dict(lang),get lang(){return lang;},get mode(){return mode;}};
})();
